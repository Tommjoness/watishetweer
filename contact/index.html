<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | watishetweer.nl</title>
<meta name="description" content="Vragen of feedback over watishetweer.nl? Vind hier het contactadres en kopieer het eenvoudig.">
<link rel="canonical" href="https://watishetweer.nl/contact/">
<meta name="robots" content="index,follow">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<meta name="theme-color" content="#F4F5F3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<script>
(()=>{try{
  /* Hetzelfde themacontract als de weerpagina's: eerst de keuze van deze
     browsersessie, dan de (compatibele) opgeslagen keuze, anders Auto: dan volgt
     de pagina de donkere of lichte stand van het systeem, ook als die wisselt. */
  const lees=(opslag,sleutel)=>{try{const raw=opslag.getItem(sleutel);return raw==null?null:JSON.parse(raw);}catch(e){return null;}};
  const sessie=lees(sessionStorage,"weerbriefing.thema.sessie"),opgeslagen=lees(localStorage,"weerbriefing.thema");
  const keuze=["auto","licht","donker"].includes(sessie)?sessie:["licht","donker"].includes(opgeslagen)?opgeslagen:"auto";
  const systeem=typeof matchMedia==="function"?matchMedia("(prefers-color-scheme: dark)"):null;
  const pas=()=>{
    const donker=keuze==="donker"||(keuze==="auto"&&!!(systeem&&systeem.matches));
    if(keuze!=="auto"||donker)document.documentElement.setAttribute("data-thema",donker?"donker":"licht");
    else document.documentElement.removeAttribute("data-thema");
    const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute("content",donker?"#0B120F":"#F4F5F3");
  };
  pas();
  if(keuze==="auto"&&systeem){if(typeof systeem.addEventListener==="function")systeem.addEventListener("change",pas);else if(typeof systeem.addListener==="function")systeem.addListener(pas);}
}catch(e){}})();
</script>
<style>
@font-face{font-family:"Instrument Sans";src:url(/instrument-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}@font-face{font-family:"Instrument Sans";src:url(/instrument-sans-latin-500-normal.woff2) format("woff2");font-weight:500 700;font-display:swap}@font-face{font-family:"Bodoni Moda";src:url(/bodoni-moda-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
:root{--paper:#f4f5f3;--sheet:#fff;--ink:#12211c;--ink-70:#41514b;--muted:#65716c;--rule:#dce1de;--serif:"Bodoni Moda",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,sans-serif}
html[data-thema="donker"]{--paper:#0a0a0a;--sheet:#141414;--ink:#ededed;--ink-70:#b8b8b8;--muted:#999;--rule:#2a2a2a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);padding:32px 20px}.kaart{max-width:760px;margin:auto;background:var(--sheet);border:1px solid var(--rule);padding:32px}h1{font:400 36px/1.15 var(--serif);margin:0 0 18px}h2{font-size:17px;margin:30px 0 8px}p{margin:10px 0;color:var(--ink-70)}a{color:inherit}.merk{font-weight:600;color:var(--ink)}.klein{color:var(--muted);font-size:14px}@media(max-width:600px){body{padding:14px}.kaart{padding:26px 22px}h1{font-size:32px}}
</style>
<style>
.contact-actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}
.contact-actions a,.contact-actions button{font:600 15px/1.35 var(--sans);display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 16px;border:1px solid var(--ink);border-radius:3px;background:var(--sheet);color:var(--ink);cursor:pointer;text-decoration:none}
.contact-actions a:hover,.contact-actions button:hover{text-decoration:underline;text-underline-offset:3px}
.contact-actions a:focus-visible,.contact-actions button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#kopie-status{min-height:1.5em}
</style>
</head>
<body>
<main class="kaart">
<p><a href="/">← Terug naar het weer</a></p>
<h1>Contact</h1>
<p>Heb je een vraag, opmerking of idee voor watishetweer.nl? Je kunt een e-mail sturen naar <a id="contact-adres" href="mailto:support@watishetweer.nl">support@watishetweer.nl</a>.</p>
<div class="contact-actions">
<a href="mailto:support@watishetweer.nl">E-mail openen</a>
<button type="button" id="kopieer-adres">Kopieer e-mailadres</button>
</div>
<p id="kopie-status" role="status" aria-live="polite" class="klein"></p>
<p class="klein">Wanneer je mailprogramma niet automatisch opent, kun je het adres hierboven selecteren of kopiëren.</p>
<p><a href="/privacy">Privacy &amp; gegevens</a></p>
</main>
<script>
(()=>{"use strict";
const knop=document.getElementById("kopieer-adres"),status=document.getElementById("kopie-status");
knop.addEventListener("click",async()=>{
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error("clipboard-unavailable");
    await navigator.clipboard.writeText("support@watishetweer.nl");
    status.textContent="E-mailadres gekopieerd.";
  }catch(e){status.textContent="Kopiëren lukte niet. Selecteer het e-mailadres hierboven om het handmatig te kopiëren.";}
});
})();
</script>
</body>
</html>
