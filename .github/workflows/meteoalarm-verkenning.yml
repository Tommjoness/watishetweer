name: MeteoAlarm EDR-verkenning

# Test de MeteoAlarm-API-sleutel (omgevingssecret METEOALARM_CONTROLE_API_TOKEN) en legt de
# structuur van een echt antwoord vast voor de koppeling "waarschuwingen per
# plaats". Handmatig te starten. Op pull requests draait hij bewust niet (SEC-02):
# hij gebruikt een geheim en PR-code mag geen secrets ontvangen. De sleutel gaat
# alleen als Authorization-header mee; het log
# en de steekproef bevatten geen sleutel en geen ondertekende opslaglinks.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verken:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # SEC-02b: het token staat uitsluitend als omgevingssecret in `provider-controles` (alleen branch main).
    environment:
      name: provider-controles
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Steekproef NL, BE en DE (sleutel als header)
        env:
          METEOALARM_API_TOKEN: ${{ secrets.METEOALARM_CONTROLE_API_TOKEN }}
        run: node scripts/meteoalarm-edr-verken.js NL BE DE
      - name: Bewaar geschoonde steekproef
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: meteoalarm-edr-steekproef
          path: meteoalarm-edr-steekproef.json
          if-no-files-found: ignore
          retention-days: 7
