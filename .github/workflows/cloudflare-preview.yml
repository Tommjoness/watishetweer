name: Cloudflare preview

# BEVEILIGINGSGRENS (SEC-02). Deze workflow draait onbetrouwbare PR-code en heeft
# daarom GEEN toegang tot secrets: geen Cloudflare-token, geen Analytics-token,
# geen Access-servicetoken. Hij bouwt uitsluitend het artifact en levert dat als
# gegevensbundel af. De vertrouwde workflow "Cloudflare preview deploy"
# (cloudflare-preview-deploy.yml, draait vanuit main via workflow_run) valideert
# die bundel, rolt hem uit en voert de previewcontroles uit. Voeg hier nooit
# secrets, `pull_request_target` of deploystappen toe; scripts/workflow-secretgrens.test.js
# bewaakt dat.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: watishetweer-cloudflare-preview-bouw-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      WEATHER_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout exacte bron-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Installeer dependencies
        run: npm ci --ignore-scripts

      - name: Bouw Cloudflare artifact
        run: npm run build:cloudflare

      - name: Stel previewbundel samen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-bundle
          cp -R public functions api lib preview-bundle/
          printf '{"pr":%s,"sha":"%s"}\n' "$PR_NUMBER" "$SOURCE_SHA" > preview-bundle/meta.json
          du -sh preview-bundle

      - name: Lever previewbundel af
        uses: actions/upload-artifact@v6
        with:
          name: preview-bundle
          path: preview-bundle/
          if-no-files-found: error
          retention-days: 3
