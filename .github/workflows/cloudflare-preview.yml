name: Cloudflare preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: watishetweer-cloudflare-preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.preview_url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: watishetweer
      CLOUDFLARE_PREVIEW_BRANCH: pr-${{ github.event.pull_request.number || github.run_id }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exacte bron-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Installeer dependencies
        run: npm install --ignore-scripts

      - name: Controleer Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SOURCE_SHA"

      - name: Controleer Pages-projectconfig
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$API" -o /tmp/cloudflare-project.json
          jq -e '.success == true' /tmp/cloudflare-project.json >/dev/null
          production_branch="$(jq -r '.result.production_branch // ""' /tmp/cloudflare-project.json)"
          echo "Cloudflare production branch: $production_branch"
          test "$production_branch" = main

      - name: Bouw Cloudflare artifact
        env:
          WEATHER_BUILD_SHA: ${{ env.SOURCE_SHA }}
        run: npm run build:cloudflare

      - name: Deploy preview naar Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy public \
            --project-name="$CLOUDFLARE_PROJECT" \
            --branch="$CLOUDFLARE_PREVIEW_BRANCH" \
            --commit-hash="$SOURCE_SHA" \
            --commit-message="Cloudflare preview $SOURCE_SHA" \
            --commit-dirty=true | tee /tmp/cloudflare-deploy.log

      - name: Noteer preview-URL
        id: preview_url
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[[:alnum:]-]+\.watishetweer\.pages\.dev' /tmp/cloudflare-deploy.log | head -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo '## Cloudflare preview'
            echo
            echo "Immutable: $URL"
            echo
            echo "Branch: $CLOUDFLARE_PREVIEW_BRANCH"
            echo
            echo "Bron-SHA: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL"

      - name: Wacht tot Pages Functions actief zijn
        env:
          CLOUDFLARE_ROOT: ${{ steps.preview_url.outputs.url }}
        run: node scripts/cloudflare-functions-readiness.js

      - name: Test Cloudflare headers, routes en API-contracten
        env:
          PREVIEW_ROOT: ${{ steps.preview_url.outputs.url }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        run: node scripts/cloudflare-preview-smoke.js

  preview-worldwide:
    needs: preview
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PREVIEW_ROOT: ${{ needs.preview.outputs.preview_url }}
    steps:
      - name: Checkout exacte bron-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Installeer Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1

      # Deze visuele gate gebruikt live deployed HTML/CSS/JS en live weerdata,
      # maar een gecontroleerde zoekfixture. Draai hem vóór de zware live
      # wereldmatrix zodat externe providerbursts de layouttest niet beïnvloeden.
      - name: Echte responsive preview met tijdelijke screenshots
        env:
          PREVIEW_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        run: node scripts/preview-responsive-visual-browser.js

      - name: Wereldwijde preview in mobiel en desktop
        env:
          PRODUCTION_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        run: node scripts/run-production-worldwide-browser.js

  pre-fix-production-cold-load:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Instrumenteer twintig onafhankelijke productie-cold-loads vóór de fix
        env:
          PRODUCTION_ROOT: https://watishetweer.nl
          EXPECTED_SHA: 1398a76360caf2ded85ea35fe9573d7c8eade501
          COLD_LOAD_RUNS: 20
          COLD_LOAD_OBSERVATION_MS: 12000
          COLD_LOAD_ARTIFACT: artifacts/cold-load-baseline.json
        run: node scripts/production-cold-load-diagnostic-browser.js
      - name: Bewaar baseline-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-load-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/cold-load-baseline.json
          if-no-files-found: warn
          retention-days: 14
