name: Cloudflare preview deploy

# VERTROUWDE KANT VAN DE PREVIEW (SEC-02). Deze workflow draait vanuit de
# standaardbranch (main) nadat "Cloudflare preview" (de secretloze PR-build) klaar
# is. Alleen deze workflow krijgt Cloudflare-credentials.
#
# Regels:
# - De bundel uit de PR-build is gegevens, geen code: eerst valideren
#   (scripts/ci/preview-bundel-valideer.js), daarna uitrollen. Niets uit de bundel
#   wordt uitgevoerd; wrangler, wrangler.jsonc en alle controlescripts komen uit main.
# - Het PR-nummer en de SHA komen uit de gebeurtenis van GitHub, niet uit de bundel.
# - Alleen PR's uit deze repository (geen forks).
# - De testjobs die PR-code uitchecken (preview-*) krijgen uitsluitend het
#   Access-servicetoken voor beschermde previews en een alleen-lezen GITHUB_TOKEN.
#   Nooit Cloudflare-API-, Analytics-, KNMI- of MeteoAlarm-secrets.
# Wijzig deze indeling alleen samen met scripts/workflow-secretgrens.test.js.

on:
  workflow_run:
    workflows: ["Cloudflare preview"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: watishetweer-cloudflare-preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      preview_url: ${{ steps.preview_url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: watishetweer
      CLOUDFLARE_PREVIEW_BRANCH: pr-${{ github.event.workflow_run.pull_requests[0].number }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout vertrouwde standaardbranch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Installeer dependencies (vertrouwd lockfile)
        run: npm ci --ignore-scripts

      - name: Controleer gebeurtenisgegevens
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Geen geldig PR-nummer in de workflow_run-gebeurtenis." >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Geen geldige head-SHA in de workflow_run-gebeurtenis." >&2; exit 1; }

      - name: Download previewbundel (gegevens, geen code)
        uses: actions/download-artifact@v6
        with:
          name: preview-bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-bundle

      - name: Valideer previewbundel
        run: node scripts/ci/preview-bundel-valideer.js "$RUNNER_TEMP/preview-bundle" --sha "$SOURCE_SHA" --pr "$PR_NUMBER"

      - name: Controleer Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ANALYTICS_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SOURCE_SHA"
          if { test -n "$CF_ACCESS_CLIENT_ID" && test -z "$CF_ACCESS_CLIENT_SECRET"; } || { test -z "$CF_ACCESS_CLIENT_ID" && test -n "$CF_ACCESS_CLIENT_SECRET"; }; then
            echo "Cloudflare Access service token is onvolledig." >&2
            exit 1
          fi

      - name: Controleer Pages-projectconfig
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$API" -o /tmp/cloudflare-project.json
          jq -e '.success == true' /tmp/cloudflare-project.json >/dev/null
          production_branch="$(jq -r '.result.production_branch // ""' /tmp/cloudflare-project.json)"
          echo "Cloudflare production branch: $production_branch"
          test "$production_branch" = main

      - name: Controleer dedicated Analytics-token read-only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {haalRapport}=require('./scripts/cloudflare-human-analytics-report.js');
          (async()=>{
            const report=await haalRapport({
              accountId:process.env.CLOUDFLARE_ACCOUNT_ID,
              token:process.env.CLOUDFLARE_ANALYTICS_API_TOKEN,
              vensters:[1]
            });
            if(!report||!Array.isArray(report.vensters)||report.vensters.length!==1){
              throw new Error('Dedicated Cloudflare Analytics-token gaf geen geldig RUM-rapport.');
            }
            console.log('Dedicated Cloudflare Analytics-token kan RUM read-only lezen.');
          })().catch(error=>{console.error(error&&error.stack||error);process.exit(1);});
          NODE

      - name: Sync Cloudflare admin analytics preview-bindings
        env:
          CLOUDFLARE_DEPLOYMENT_ENV: preview
        run: node scripts/cloudflare-admin-analytics-runtime.js

      - name: Deploy preview naar Cloudflare Pages
        shell: bash
        working-directory: ${{ runner.temp }}/preview-bundle
        run: |
          set -euo pipefail
          # Configuratie en wrangler komen uit main, nooit uit de bundel.
          cp "$GITHUB_WORKSPACE/wrangler.jsonc" wrangler.jsonc
          node "$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js" pages deploy public \
            --project-name="$CLOUDFLARE_PROJECT" \
            --branch="$CLOUDFLARE_PREVIEW_BRANCH" \
            --commit-hash="$SOURCE_SHA" \
            --commit-message="Cloudflare preview $SOURCE_SHA" \
            --commit-dirty=true | tee /tmp/cloudflare-deploy.log

      - name: Verifieer SEO previewconfig na deploy
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$API" -o /tmp/cloudflare-project-after-preview.json
          jq -e '.success == true' /tmp/cloudflare-project-after-preview.json >/dev/null
          jq -e '.result.deployment_configs.preview.env_vars.CF_ACCESS_TEAM_DOMAIN.type == "secret_text"' /tmp/cloudflare-project-after-preview.json >/dev/null
          jq -e '.result.deployment_configs.preview.env_vars.CF_ACCESS_AUD.type == "secret_text"' /tmp/cloudflare-project-after-preview.json >/dev/null
          jq -e '.result.deployment_configs.preview.env_vars.SEO_ADMIN_EMAILS.type == "secret_text"' /tmp/cloudflare-project-after-preview.json >/dev/null
          jq -e '.result.deployment_configs.preview.env_vars.CLOUDFLARE_ANALYTICS_API_TOKEN.type == "secret_text"' /tmp/cloudflare-project-after-preview.json >/dev/null
          jq -e '.result.deployment_configs.preview.env_vars.CLOUDFLARE_ACCOUNT_ID.type == "secret_text"' /tmp/cloudflare-project-after-preview.json >/dev/null
          jq -e '.result.deployment_configs.preview.env_vars.GA4_PROPERTY_ID.type == "secret_text"' /tmp/cloudflare-project-after-preview.json >/dev/null
          echo "SEO Access-, Analytics- en GA4-previewconfig is na deploy compleet aanwezig."

      - name: Noteer preview-URL
        id: preview_url
        shell: bash
        run: |
          set -euo pipefail
          URL="$(grep -Eo 'https://[[:alnum:]-]+\.watishetweer\.pages\.dev' /tmp/cloudflare-deploy.log | head -1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo '## Cloudflare preview'
            echo
            echo "Immutable: $URL"
            echo
            echo "Branch: $CLOUDFLARE_PREVIEW_BRANCH"
            echo
            echo "Bron-SHA: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL"

      - name: Wacht tot Pages Functions actief zijn
        env:
          CLOUDFLARE_ROOT: ${{ steps.preview_url.outputs.url }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/cloudflare-functions-readiness.js

      - name: Test Cloudflare headers, routes en API-contracten
        env:
          PREVIEW_ROOT: ${{ steps.preview_url.outputs.url }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/cloudflare-preview-smoke.js

      - name: Netwerkdiagnostiek bij mislukking
        if: failure() && steps.preview_url.outputs.url != ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          NETWERK_ROOT: ${{ steps.preview_url.outputs.url }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/netwerkdiagnostiek.js

  # Vanaf hier wordt PR-code uitgecheckt en uitgevoerd. Deze jobs hebben alleen het
  # Access-servicetoken (alleen geldig voor beschermde previews) en `contents: read`.
  preview-worldwide:
    needs: preview
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      PREVIEW_ROOT: ${{ needs.preview.outputs.preview_url }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout exacte bron-SHA (onbetrouwbaar)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Installeer Playwright
        run: npm ci --ignore-scripts

      - name: Echte responsive preview met bewaarde screenshots
        env:
          PREVIEW_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/preview-responsive-visual-browser.js

      - name: Bewaar responsive screenshotbewijs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-responsive-${{ env.SOURCE_SHA }}
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Bewijs WeatherAPI-fallback met geblokkeerde Open-Meteo
        env:
          PRODUCTION_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/weatherapi-live-fallback-browser.js

      - name: Wereldwijde preview in mobiel en desktop
        env:
          PRODUCTION_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          WORLDWIDE_SOURCE_PACING_MS: 5000
          WORLDWIDE_SOURCE_RETRY_BACKOFF_MS: 5000
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/run-production-worldwide-browser.js

      - name: Finale locatie- en cold-loadacceptatie op deployed preview
        env:
          PRODUCTION_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          COLD_LOAD_RUNS_PER_PROFILE: 5
          COLD_LOAD_OBSERVATION_MS: 12000
          COLD_LOAD_PACING_MS: 15000
          COLD_LOAD_ATTEMPTS: 3
          COLD_LOAD_PROFILE_COOLDOWN_MS: 45000
          HISTORY_SOURCE_INITIAL_COOLDOWN_MS: 30000
          HISTORY_SOURCE_PACING_MS: 15000
          HISTORY_SOURCE_RETRY_BACKOFF_MS: 10000
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/run-production-pre-sale-acceptance-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          NETWERK_ROOT: ${{ env.PREVIEW_ROOT }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/netwerkdiagnostiek.js

  preview-release-navigation:
    needs: preview
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      PREVIEW_ROOT: ${{ needs.preview.outputs.preview_url }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout exacte bron-SHA (onbetrouwbaar)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Installeer Chromium-driver
        run: npm ci --ignore-scripts

      - name: Installeer native browserreload-driver
        run: apt-get update && apt-get install -y --no-install-recommends xdotool

      - name: Bewijs release-navigatie en echte offline serviceworker-reload
        env:
          PRODUCTION_ROOT: ${{ env.PREVIEW_ROOT }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          HEADLESS: "false"
          NATIVE_BROWSER_RELOAD: "true"
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: xvfb-run --auto-servernum node scripts/production-release-recovery-navigation.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          NETWERK_ROOT: ${{ env.PREVIEW_ROOT }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/netwerkdiagnostiek.js

  preview-cwv:
    needs: preview
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout exacte bron-SHA (onbetrouwbaar)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Verifieer route-CLS, desktoplayout en lokale uurwissels op preview
        env:
          CWV_ROOT: ${{ needs.preview.outputs.preview_url }}
          EXPECTED_SHA: ${{ env.SOURCE_SHA }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/cwv-desktop-recovery-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          NETWERK_ROOT: ${{ needs.preview.outputs.preview_url }}
          NODE_OPTIONS: --require=./scripts/cloudflare-access-preload.cjs
        run: node scripts/netwerkdiagnostiek.js
      - name: Bewaar deployed CWV-bewijs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-cwv-${{ env.SOURCE_SHA }}
          path: cwv-evidence/
          retention-days: 14

  # Workflow_run-checks horen bij main, niet bij de PR. Deze job zet de uitkomst als
  # commitstatus op de PR-head, zodat de previewresultaten zichtbaar blijven. Een
  # overgeslagen of geannuleerde job telt nooit als geslaagd (REL-01).
  status:
    needs: [preview, preview-worldwide, preview-release-navigation, preview-cwv]
    if: always() && needs.preview.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      R_PREVIEW: ${{ needs.preview.result }}
      R_WORLDWIDE: ${{ needs.preview-worldwide.result }}
      R_NAVIGATION: ${{ needs.preview-release-navigation.result }}
      R_CWV: ${{ needs.preview-cwv.result }}
    steps:
      - name: Zet previewstatussen op de PR-head
        shell: bash
        run: |
          set -euo pipefail
          zet() {
            local context="$1" resultaat="$2" state beschrijving
            case "$resultaat" in
              success) state=success; beschrijving="geslaagd" ;;
              skipped) state=error; beschrijving="overgeslagen: telt niet als geslaagd" ;;
              cancelled) state=error; beschrijving="geannuleerd: telt niet als geslaagd" ;;
              *) state=failure; beschrijving="mislukt" ;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
              -f state="$state" -f context="$context" -f description="$beschrijving" -f target_url="$RUN_URL" >/dev/null
            echo "$context: $state ($resultaat)"
          }
          zet preview "$R_PREVIEW"
          zet preview-worldwide "$R_WORLDWIDE"
          zet preview-release-navigation "$R_NAVIGATION"
          zet preview-cwv "$R_CWV"
