name: Tijdelijke mobiele UX-polish
on:
  push:
    branches:
      - agent/mobile-ux-final-polish
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mobile-ux-final-polish
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Herstel testharnas van eenmalige migratie
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/ux-mobile-polish.mjs')
          s=p.read_text()
          s=s.replace('index.includes("${Math.round(sc)}/10")', 'index.includes("\\${Math.round(sc)}/10")')
          s=s.replace('ok(!index.includes("Nu is het ")+!index.includes("De actuele temperatuur is niet beschikbaar.")>0,', 'ok(!index.includes("Nu is het ")&&!index.includes("De actuele temperatuur is niet beschikbaar."),')
          marker="let tests=lees('prelaunch-regressions.test.js');"
          toevoeg="""\ntests=tests.replace('const index=lees(\"index.html\"),waars=', 'const index=lees(\"index.html\"),engine=lees(\"interpretatie-engine.js\"),waars=');"""
          if toevoeg.strip() not in s:
              s=s.replace(marker,marker+toevoeg)
          p.write_text(s)
          PY
      - name: Pas eenmalige UX-polish toe
        run: |
          node .github/ux-mobile-polish.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          oud='''    }\n  }\n\n  /* De interpretatielaag vervangt uitsluitend de neerslagzin.'''
          nieuw='''    }\n  }else{\n    zin3="Windgegevens zijn momenteel niet beschikbaar.";\n  }\n\n  /* De interpretatielaag vervangt uitsluitend de neerslagzin.'''
          if oud not in s:
              raise SystemExit('windfallback-invoegpunt niet gevonden')
          p.write_text(s.replace(oud,nieuw,1))

          p=Path('senior-7-regressions.test.js')
          s=p.read_text().replace('index.includes("Neerslagkans binnenkort")&&engine.includes("de komende circa 60 minuten")','index.includes("Komend uur")&&engine.includes("de komende circa 60 minuten")')
          p.write_text(s)

          p=Path('built-production-regressions.test.js')
          s=p.read_text()
          s=s.replace('ok(/2,4 mm/.test(tekst(bak.precsub)),"dagelijkse neerslagsom blijft zichtbaar",tekst(bak.precsub));','ok(!/2,4 mm/.test(tekst(bak.precsub)),"recente neerslagtegel mengt geen dagsom in het korte tijdvak",tekst(bak.precsub));')
          s=s.replace('ok(/Volgens het model/.test(t),"recente neerslag wordt als modelinformatie benoemd",t);','ok(/model|gemodelleerd/i.test(t),"recente neerslag wordt als modelinformatie benoemd",t);')
          s=s.replace('ok(/Modelscore 0-10/.test(t),"nachtzichtscore is als modelscore gelabeld",t.slice(0,300));ok(/Modelvenster \\(bewolking en maan\\)/.test(t),"nachtzichtvenster noemt beperkte factoren",t.slice(0,300));','ok(/Score/.test(t)&&/\\d+\\/10/.test(t),"nachtzichtscore is compact en begrijpelijk gelabeld",t.slice(0,300));ok(/Beste zichtperiode/.test(t),"nachtzicht benoemt de beste zichtperiode consumentgericht",t.slice(0,300));')
          p.write_text(s)
          PY
      - name: Volledige regressies en productiebuild
        run: npm test
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Echte browsers — mobiel en desktop
        run: node browser-playwright.test.js
      - name: Leg exact geteste productcode vast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html interpretatie-engine.js build-weather.js prelaunch-regressions.test.js senior-7-regressions.test.js built-production-regressions.test.js
          git diff --cached --quiet && { echo "Geen productwijzigingen om vast te leggen"; exit 1; }
          git commit -m "Polijst mobiele consumenten-UX"
          git push origin HEAD:agent/mobile-ux-final-polish
