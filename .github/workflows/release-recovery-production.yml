name: Release recovery production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-recovery-production
  cancel-in-progress: false

jobs:
  static-production-contract:
    runs-on: ubuntu-latest
    # SHA-wacht tot 15 min (productiebuild ~9 min) plus de serviceworkerwacht.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Wacht op exacte productie-SHA en controleer routebundles
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RECOVERY_SMOKE_ATTEMPTS: 180
          RECOVERY_SMOKE_POLL_MS: 5000
        run: node scripts/production-release-recovery.js

  browser-production-contract:
    needs: static-production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installeer Chromium-driver
        run: npm ci --ignore-scripts
      - name: Installeer native browserreload-driver (vastgepind, zonder pakketserver)
        # Twee officiële Ubuntu 24.04-pakketten uit de repository in plaats van apt-get (scripts/ci/native-reload-driver/README.md).
        # De SHA-256 staat in deze workflow en wordt vóór de installatie gecontroleerd; alleen deze twee bestanden worden geïnstalleerd.
        working-directory: scripts/ci/native-reload-driver
        run: |
          set -eu
          sha256sum --check --strict - <<'SHA256'
          3506c2824a74255439813f824a1629387452d52c6efd6d7916b8b54e458175e8  libxdo3_3.20160805.1-5build1_amd64.deb
          58a202c74bce31ca2d72d4d514942a5ab6191932696adc5d21d909c9216b13cb  xdotool_3.20160805.1-5build1_amd64.deb
          SHA256
          dpkg --install libxdo3_3.20160805.1-5build1_amd64.deb xdotool_3.20160805.1-5build1_amd64.deb
          command -v xdotool
      - name: Test actieve productie no-JS, failed-JS, refresh en BFCache
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: xvfb-run --auto-servernum node scripts/production-release-recovery-browser.js
      - name: Bewijs WeatherAPI-fallback met geblokkeerde Open-Meteo
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/weatherapi-live-fallback-browser.js
      - name: Test hard refresh, nieuw tabblad, Back/Forward en SW-cachegeneratie
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HEADLESS: "false"
          NATIVE_BROWSER_RELOAD: "true"
          NAVIGATION_INITIAL_COOLDOWN_MS: 15000
          NAVIGATION_WEATHER_RETRY_BACKOFF_MS: 5000
        run: xvfb-run --auto-servernum node scripts/production-release-recovery-navigation.js
