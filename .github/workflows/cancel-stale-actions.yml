name: Cancel stale Actions runs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    if: github.head_ref == 'ops/cancel-stale-actions-20260826'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Try deleting stale incident runs
        shell: bash
        run: |
          set -u
          ids=(32984194006 32985269547 32985304066 32983999874 32983975570)
          for id in "${ids[@]}"; do
            echo "=== RUN $id BEFORE ==="
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/runs/$id" | jq '{id,name,status,conclusion,head_sha,event,run_attempt}' || true
            code="$(curl -sS -o /tmp/delete-$id.out -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/runs/$id")"
            echo "delete HTTP $code"
            cat /tmp/delete-$id.out || true
          done
          sleep 3
          for id in "${ids[@]}"; do
            echo "=== RUN $id AFTER ==="
            code="$(curl -sS -o /tmp/get-$id.out -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/actions/runs/$id")"
            echo "GET HTTP $code"
            if [[ "$code" == "200" ]]; then jq '{id,name,status,conclusion,head_sha,event,run_attempt}' /tmp/get-$id.out; else cat /tmp/get-$id.out || true; fi
          done
          exit 0
