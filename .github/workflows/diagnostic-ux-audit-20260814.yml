name: WeatherNow production UX audit diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Capture production UX in Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install browsers
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Audit live UI
        run: |
          mkdir -p ux-audit
          cat > /tmp/ux-audit.js <<'NODE'
          "use strict";
          const { chromium, webkit } = require("playwright");
          const fs = require("fs");
          const scenarios = [
            {name:"ams-390", url:"https://watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL", viewport:{width:390,height:844}},
            {name:"ams-320", url:"https://watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL", viewport:{width:320,height:700}},
            {name:"ams-430", url:"https://watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL", viewport:{width:430,height:932}},
            {name:"ams-desktop", url:"https://watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL", viewport:{width:1440,height:900}},
            {name:"tokyo-390", url:"https://watishetweer.nl/?lat=35.6762&lon=139.6503&plaats=Tokyo&land=JP", viewport:{width:390,height:844}},
            {name:"longyearbyen-390", url:"https://watishetweer.nl/?lat=78.2232&lon=15.6469&plaats=Longyearbyen&land=NO", viewport:{width:390,height:844}},
            {name:"www-390", url:"https://www.watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL", viewport:{width:390,height:844}, smoke:true}
          ];
          const engines = [["chromium",chromium],["webkit",webkit]];

          function safeName(s){ return s.replace(/[^a-z0-9_-]+/gi,"-"); }

          async function loadScenario(browser, engineName, s){
            let lastError = null;
            for(let attempt=1; attempt<=3; attempt++){
              const context = await browser.newContext({viewport:s.viewport, deviceScaleFactor:1});
              const page = await context.newPage();
              const consoleErrors=[]; const pageErrors=[];
              page.on("console",m=>{ if(m.type()==="error") consoleErrors.push(m.text()); });
              page.on("pageerror",e=>pageErrors.push(String(e)));
              try{
                const res=await page.goto(s.url,{waitUntil:"domcontentloaded",timeout:30000});
                if(!res || res.status()>=400) throw new Error(`HTTP ${res&&res.status()}`);
                const loaded=await page.waitForFunction(()=>{
                  const days=document.querySelectorAll("#days .row.day:not(.kop)").length;
                  const st=document.getElementById("state");
                  const visible=st && getComputedStyle(st).display!=="none";
                  return days>=7 || (visible && /mislukt|duurt te lang|verbinding/i.test(st.textContent||""));
                },null,{timeout:26000}).then(()=>true).catch(()=>false);
                if(!loaded) throw new Error("UI did not reach loaded/error state");
                const state=await page.evaluate(()=>({
                  days:document.querySelectorAll("#days .row.day:not(.kop)").length,
                  state:(document.getElementById("state")?.textContent||"").trim(),
                  stateVisible:!!(document.getElementById("state")&&getComputedStyle(document.getElementById("state")).display!=="none")
                }));
                if(state.days<7) throw new Error(`provider/UI state: ${JSON.stringify(state)}`);
                await page.waitForTimeout(800);
                const metrics=await page.evaluate(()=>{
                  const q=s=>document.querySelector(s);
                  const qa=s=>Array.from(document.querySelectorAll(s));
                  const rect=el=>el?(()=>{const r=el.getBoundingClientRect();return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}})():null;
                  const styles=el=>el?(()=>{const c=getComputedStyle(el);return {fontSize:c.fontSize,lineHeight:c.lineHeight,fontWeight:c.fontWeight,overflowX:c.overflowX,whiteSpace:c.whiteSpace}})():null;
                  return {
                    url:location.href,
                    title:document.title,
                    viewport:{w:innerWidth,h:innerHeight},
                    document:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight},
                    body:{w:document.body.scrollWidth,h:document.body.scrollHeight},
                    overflowX:document.documentElement.scrollWidth>innerWidth+1,
                    h1:(q("h1")?.textContent||"").trim(),
                    locationText:(q("#locatie")?.textContent||q("#plaats")?.textContent||"").trim(),
                    top:rect(q("header")||q(".hero")||q("main")),
                    current:rect(q("#current")||q("#nu")),
                    days:rect(q("#days")),
                    nights:rect(q("#nights")),
                    dayRows:qa("#days .row.day:not(.kop)").length,
                    nightRows:qa("#nights .row.night:not(.kop)").length,
                    dayTexts:qa("#days .row.day:not(.kop)").slice(0,3).map(x=>x.innerText.trim().replace(/\s+/g," ")),
                    nightTexts:qa("#nights .row.night:not(.kop)").slice(0,3).map(x=>x.innerText.trim().replace(/\s+/g," ")),
                    buttons:qa("button").map(b=>({text:(b.innerText||b.getAttribute("aria-label")||"").trim(),rect:rect(b),style:styles(b)})),
                    links:qa("a").filter(a=>a.offsetParent!==null).map(a=>({text:(a.innerText||a.getAttribute("aria-label")||"").trim(),rect:rect(a),style:styles(a)})).slice(0,30),
                    minibar:{rect:rect(q("#minibar")),style:styles(q("#minibar")),className:q("#minibar")?.className||""},
                    status:(q("#state")?.textContent||"").trim(),
                    smallText:qa("body *").filter(el=>el.childElementCount===0&&el.offsetParent!==null).map(el=>({text:(el.textContent||"").trim(),fs:parseFloat(getComputedStyle(el).fontSize)||0,tag:el.tagName,cls:el.className||""})).filter(x=>x.text&&x.fs<11).slice(0,80)
                  };
                });
                if(metrics.overflowX) throw new Error(`horizontal overflow ${metrics.document.w}/${metrics.viewport.w}`);
                if(pageErrors.length) throw new Error(`pageerror: ${pageErrors.join(" | ")}`);
                const base=`ux-audit/${engineName}-${safeName(s.name)}`;
                await page.screenshot({path:`${base}-full.png`,fullPage:true});
                await page.screenshot({path:`${base}-top.png`,fullPage:false});
                for(const [label,selector] of [["days","#days"],["nights","#nights"]]){
                  const el=page.locator(selector);
                  if(await el.count()) await el.screenshot({path:`${base}-${label}.png`}).catch(()=>{});
                }
                fs.writeFileSync(`${base}.json`,JSON.stringify({engine:engineName,scenario:s.name,attempt,metrics,consoleErrors,pageErrors},null,2));
                console.log(`${engineName}/${s.name}: OK attempt=${attempt} doc=${metrics.document.w}x${metrics.document.h} days=${metrics.dayRows} nights=${metrics.nightRows} smallText=${metrics.smallText.length} consoleErrors=${consoleErrors.length}`);
                await context.close();
                return;
              }catch(e){
                lastError=e;
                console.log(`${engineName}/${s.name}: attempt ${attempt} failed: ${e.message}`);
                await context.close();
              }
            }
            throw new Error(`${engineName}/${s.name}: ${lastError&&lastError.message}`);
          }

          (async()=>{
            for(const [engineName,launcher] of engines){
              const browser=await launcher.launch({headless:true});
              try{
                for(const s of scenarios){
                  if(s.smoke && engineName==="webkit") continue;
                  await loadScenario(browser,engineName,s);
                }
              }finally{ await browser.close(); }
            }
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/ux-audit.js
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ux-audit
          path: ux-audit
          if-no-files-found: error
          retention-days: 3
