name: WeatherNow diagnostic WebKit timeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Meet fetch-timeouts wereldwijd in WebKit
        run: |
          cat > /tmp/webkit-timeout-diagnostic.js <<'NODE'
          "use strict";
          const { webkit } = require("playwright");
          const locations = [
            ["Amsterdam",52.3702,4.8952,"NL"],
            ["New York",40.7128,-74.0060,"US"],
            ["Tokyo",35.6762,139.6503,"JP"],
            ["Sydney",-33.8688,151.2093,"AU"],
            ["Colombo",6.9271,79.8612,"LK"],
            ["Longyearbyen",78.2232,15.6469,"SJ"],
            ["Apia",-13.8333,-171.7500,"WS"]
          ];
          const attempts = 2;

          function classify(u){
            const s=String(u||"");
            if(s.includes("air-quality-api.open-meteo.com")) return "air";
            if(!s.includes("api.open-meteo.com/v1/forecast")) return "other";
            if(s.includes("minutely_15=")) return "forecast-full";
            if(s.includes("visibility") || s.includes("precipitation_probability")) return "forecast-fallback";
            return "forecast-small";
          }

          (async()=>{
            const browser=await webkit.launch({headless:true});
            try{
              for(const [name,lat,lon,land] of locations){
                const url=`https://watishetweer.nl/?lat=${lat}&lon=${lon}&plaats=${encodeURIComponent(name)}&land=${land}`;
                for(let attempt=1;attempt<=attempts;attempt++){
                  const context=await browser.newContext({viewport:{width:390,height:844}});
                  const page=await context.newPage();
                  await page.addInitScript(()=>{
                    window.__fetchTrace=[];
                    const original=window.fetch.bind(window);
                    window.fetch=async function(...args){
                      const input=args[0];
                      const u=typeof input==="string"?input:(input&&input.url)||String(input||"");
                      const started=performance.now();
                      try{
                        const response=await original(...args);
                        window.__fetchTrace.push({url:u,ok:true,status:response.status,ms:Math.round(performance.now()-started)});
                        return response;
                      }catch(error){
                        window.__fetchTrace.push({url:u,ok:false,name:error&&error.name||"",message:error&&error.message||String(error),ms:Math.round(performance.now()-started)});
                        throw error;
                      }
                    };
                  });
                  const started=Date.now();
                  let outcome="timeout";
                  try{
                    const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
                    if(!response||response.status()>=400) throw new Error(`HTTP ${response&&response.status()}`);
                    outcome=await Promise.race([
                      page.waitForFunction(()=>{
                        const app=document.getElementById("app");
                        const days=document.querySelectorAll("#days .row.day:not(.kop)").length;
                        const state=document.getElementById("state");
                        const appVisible=!!(app&&getComputedStyle(app).display!=="none");
                        const stateVisible=!!(state&&getComputedStyle(state).display!=="none");
                        const stateText=stateVisible?state.textContent.trim():"";
                        if(appVisible&&days>=7) return "loaded";
                        if(stateText&&/mislukt|duurt te lang|probeer het opnieuw|geen verbinding|fout/i.test(stateText)) return "state:"+stateText;
                        return false;
                      },{timeout:26000}).then(h=>h.jsonValue()),
                      new Promise(resolve=>setTimeout(()=>resolve("timeout"),27000))
                    ]);
                  }catch(error){ outcome="navigation:"+(error&&error.message||String(error)); }
                  const trace=await page.evaluate(()=>window.__fetchTrace||[]).catch(()=>[]);
                  const compact=trace.map(x=>({kind:classify(x.url),ok:x.ok,status:x.status||0,name:x.name||"",message:x.message||"",ms:x.ms}));
                  console.log(`${name}/attempt-${attempt}: outcome=${JSON.stringify(outcome)} totalMs=${Date.now()-started}`);
                  console.log(`${name}/attempt-${attempt}: trace=${JSON.stringify(compact)}`);
                  await context.close();
                }
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1);});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/webkit-timeout-diagnostic.js
