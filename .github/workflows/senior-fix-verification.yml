name: WeatherNow quality
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Volledige niet-browser suite
        run: npm run build
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Echte browsers — mobiel en desktop
        run: node browser-playwright.test.js
      - name: Consumentenpolish — iPhone-randgeval in Chromium en WebKit
        shell: bash
        run: |
          set +e
          node browser-consumer-polish.test.js > /tmp/consumer-polish-e2e.log 2>&1
          code=$?
          cat /tmp/consumer-polish-e2e.log
          if [ "$code" -ne 0 ]; then
            msg="$(tail -n 60 /tmp/consumer-polish-e2e.log | tr '\n\r' '  ' | sed 's/%/%25/g; s/::/%3A%3A/g')"
            echo "::error file=browser-consumer-polish.test.js,line=1::$msg"
            exit "$code"
          fi
      - name: Zichtbare neerslagwaarheid — Chromium en WebKit
        shell: bash
        run: |
          set +e
          node browser-unified-weather-truth.test.js > /tmp/unified-weather-truth-e2e.log 2>&1
          code=$?
          cat /tmp/unified-weather-truth-e2e.log
          if [ "$code" -ne 0 ]; then
            msg="$(tail -n 60 /tmp/unified-weather-truth-e2e.log | tr '\n\r' '  ' | sed 's/%/%25/g; s/::/%3A%3A/g')"
            echo "::error file=browser-unified-weather-truth.test.js,line=1::$msg"
            exit "$code"
          fi
      - name: SEO-plaatsroutes — Chromium en WebKit
        shell: bash
        run: |
          set +e
          node seo-location-pages-browser.test.js > /tmp/seo-routes-e2e.log 2>&1
          code=$?
          cat /tmp/seo-routes-e2e.log
          if [ "$code" -ne 0 ]; then
            msg="$(tail -n 40 /tmp/seo-routes-e2e.log | tr '\n\r' '  ' | sed 's/%/%25/g; s/::/%3A%3A/g')"
            echo "::error file=seo-location-pages-browser.test.js,line=1::$msg"
            exit "$code"
          fi
