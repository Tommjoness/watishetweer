name: WeatherNow prelaunch hardening
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pas eenmalige pre-launch hardening toe
        run: |
          if [ -f scripts/prelaunch-hardening-12.js ]; then
            node scripts/prelaunch-hardening-12.js
            rm scripts/prelaunch-hardening-12.js
          fi
      - name: Volledige niet-browser suite
        run: npm run build
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Echte browsers — mobiel en desktop
        run: node browser-playwright.test.js
      - name: Leg exact geteste productbestanden vast
        shell: bash
        run: |
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            index.html \
            lib/waarschuwingen.cjs \
            lib/plaatsnaam.cjs \
            build-weather.js \
            sw.js \
            manifest.json \
            audit-regressions.test.js \
            prelaunch-regressions.test.js \
            privacy.html \
            package.json
          git add -u -- scripts/prelaunch-hardening-12.js
          git status --short
          if git diff --cached --quiet; then
            echo "Geen productwijzigingen om vast te leggen."
            exit 0
          fi
          git commit -m "Rond twaalf pre-launch auditpunten af"
          git push origin HEAD:${{ github.head_ref }}
