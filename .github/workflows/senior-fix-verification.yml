name: WeatherNow quality
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Volledige niet-browser suite
        run: npm run build
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Echte browsers — mobiel en desktop
        run: node browser-playwright.test.js
      - name: Productiecache zonder authenticatie
        shell: bash
        run: |
          set -euo pipefail
          url='https://weathernow-ashy-six.vercel.app/api/waarschuwingen?lat=52.35&lon=5.26'
          h1=$(mktemp)
          h2=$(mktemp)
          curl -fsS -D "$h1" -o /tmp/weather-cache-1.json "$url"
          sleep 2
          curl -fsS -D "$h2" -o /tmp/weather-cache-2.json "$url"
          echo 'Eerste request:'
          grep -iE '^(x-vercel-cache|x-vercel-id|age):' "$h1" || true
          echo 'Tweede request:'
          grep -iE '^(x-vercel-cache|x-vercel-id|age):' "$h2" || true
          cmp /tmp/weather-cache-1.json /tmp/weather-cache-2.json
          grep -qi '^x-vercel-cache: HIT' "$h2"
