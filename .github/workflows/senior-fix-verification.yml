name: WeatherNow quality
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Volledige niet-browser suite
        run: npm run build
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium webkit
      - name: Echte browsers — mobiel en desktop
        run: node browser-playwright.test.js
      - name: Consumentenpolish — iPhone-randgeval in Chromium en WebKit
        id: iphone
        shell: bash
        run: |
          set -o pipefail
          node browser-consumer-polish.test.js 2>&1 | tee browser-consumer-debug.log
      - name: Bewaar tijdelijk iPhone-foutlog
        if: failure() && steps.iphone.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-consumer-debug
          path: browser-consumer-debug.log
          retention-days: 1
