name: KNMI radar validation

on:
  push:
    branches:
      - agent/knmi-radar-validation-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/knmi-radar-capabilities-probe.mjs
