name: Temporary warning hedge patch

on:
  push:
    branches:
      - hardening/warning-fallback-hedge-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply warning hedge patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/warning-fallback-hedge-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pas warning hedge exact toe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('lib/waarschuwingen.cjs')
          s = lib.read_text()
          anchor = 'const UA = "WatIsHetWeer/1.0 (watishetweer.nl; contact via github.com/Tommjoness/weathernow)";\n'
          addition = '''const UA = "WatIsHetWeer/1.0 (watishetweer.nl; contact via github.com/Tommjoness/weathernow)";
          const METEO_COMPAT_TIMEOUT_MS = 4000;
          const METEO_ATOM_TIMEOUT_MS = 3200;
          const METEO_HEDGE_HEADER_MS = 1500;
          const METEO_HEDGE_BYTES = 2000000;
          '''
          if s.count(anchor) != 1:
              raise SystemExit('UA-anchor ontbreekt of is dubbel')
          s = s.replace(anchor, addition, 1)

          old = '''async function viaMeteoAlarm(slug, lat, lon) {
            // Eerst de publieke compatibiliteitsfeed: alleen deze kan gebiedsinformatie
            // leveren waarmee een waarschuwing tegen het gekozen punt kan worden getoetst.
            // Historisch kan deze feed groot en traag zijn, daarom maximaal 4 seconden.
            const compat = "https://feeds.meteoalarm.org/api/v1/warnings/feeds-" + slug;
            try {
              const r = await haal(compat, "application/json", 4000);
              const tekst = await r.text();
              const kop = tekst.trim().charAt(0);
              if (kop === "{" || kop === "[") {
                return { bron: compat, lijst: uitCap(JSON.parse(tekst), lat, lon), plaatsSpecifiek: true };
              }
            } catch (e) {}

            // De onderhouden Atom-feed is betrouwbaar als landfeed, maar bevat geen
            // bruikbare puntgeometrie. Daarom expliciet landbreed en nooit dominant in de
            // plaats-specifieke briefing.
            const atom = "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-" + slug;
            try {
              const r = await haal(atom, "*/*", 1800);
              const tekst = await r.text();
              if (/<feed(?:\\s|>)/i.test(tekst)) {
                return { bron: atom, lijst: uitAtom(tekst), plaatsSpecifiek: false };
              }
            } catch (e) {}
            return null;
          }
          '''
          new = '''async function viaMeteoAlarm(slug, lat, lon) {
            // De compatibiliteitsfeed blijft altijd leidend: alleen die bevat bruikbare
            // gebiedsinformatie. Grote of traag startende feeds krijgen wel een hedged
            // Atom-fallback, zodat een mislukte compatibiliteitsdownload niet daarna nog
            // eens volledig seriëel op de landfeed hoeft te wachten.
            const compat = "https://feeds.meteoalarm.org/api/v1/warnings/feeds-" + slug;
            const atom = "https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-" + slug;
            let atomBelofte = null;
            const startAtom = () => {
              if (!atomBelofte) atomBelofte = (async () => {
                try {
                  const r = await haal(atom, "*/*", METEO_ATOM_TIMEOUT_MS);
                  const tekst = await r.text();
                  if (/<feed(?:\\s|>)/i.test(tekst)) {
                    return { bron: atom, lijst: uitAtom(tekst), plaatsSpecifiek: false };
                  }
                } catch (e) {}
                return null;
              })();
              return atomBelofte;
            };

            let compatHeadersOntvangen = false;
            let headerHedge = setTimeout(() => {
              if (!compatHeadersOntvangen) void startAtom();
            }, METEO_HEDGE_HEADER_MS);
            try {
              const r = await haal(compat, "application/json", METEO_COMPAT_TIMEOUT_MS);
              compatHeadersOntvangen = true;
              clearTimeout(headerHedge);
              headerHedge = null;
              const lengteTekst = r.headers && typeof r.headers.get === "function"
                ? r.headers.get("content-length") : null;
              const lengte = Number(lengteTekst);
              if (Number.isFinite(lengte) && lengte > METEO_HEDGE_BYTES) void startAtom();
              const tekst = await r.text();
              const kop = tekst.trim().charAt(0);
              if (kop === "{" || kop === "[") {
                return { bron: compat, lijst: uitCap(JSON.parse(tekst), lat, lon), plaatsSpecifiek: true };
              }
            } catch (e) {
            } finally {
              compatHeadersOntvangen = true;
              if (headerHedge !== null) clearTimeout(headerHedge);
            }

            // Atom blijft uitsluitend fallback: ook wanneer de hedge al liep, wordt een
            // geldige compatibiliteitsresponse hierboven altijd als eerste gebruikt.
            return await startAtom();
          }
          '''
          if s.count(old) != 1:
              raise SystemExit('viaMeteoAlarm-bronblok ontbreekt of is dubbel')
          lib.write_text(s.replace(old, new, 1))

          pre = Path('prelaunch-regressions.test.js')
          p = pre.read_text()
          old_check = 'ok(waars.includes(\'haal(compat, "application/json", 4000)\')&&waars.includes(\'haal(atom, "*/*", 1800)\')&&waars.includes("timeoutMs = 6000"),"MeteoAlarm houdt compatibiliteits- en Atom-fallback samen binnen de clienttimeout");'
          new_check = 'ok(waars.includes("METEO_COMPAT_TIMEOUT_MS = 4000")&&waars.includes("METEO_ATOM_TIMEOUT_MS = 3200")&&waars.includes("METEO_HEDGE_HEADER_MS = 1500")&&waars.includes("METEO_HEDGE_BYTES = 2000000")&&index.includes("timeoutMs:7000"),"MeteoAlarm hedget trage of grote compatibiliteitsfeeds binnen het waarschuwingclientbudget");'
          if p.count(old_check) != 1:
              raise SystemExit('oude MeteoAlarm-timeoutcheck ontbreekt of is dubbel')
          pre.write_text(p.replace(old_check, new_check, 1))

          pkg = Path('package.json')
          q = pkg.read_text()
          old_pkg = 'node scripts/waarschuwing-scope.test.js && node scripts/nws-gebied.test.js'
          new_pkg = 'node scripts/waarschuwing-scope.test.js && node scripts/warning-upstream-hedge.test.js && node scripts/nws-gebied.test.js'
          if q.count(old_pkg) != 1:
              raise SystemExit('test:prebuild warning-anchor ontbreekt of is dubbel')
          pkg.write_text(q.replace(old_pkg, new_pkg, 1))

          Path('scripts/warning-upstream-hedge.test.js').write_text(r'''"use strict";
          const assert=require("assert");

          function nepRes(){return{statusCode:200,headers:{},body:null,setHeader(k,v){this.headers[String(k).toLowerCase()]=v;},status(c){this.statusCode=c;return this;},json(b){this.body=b;return this;}};}
          async function roep(query,fetchImpl){
            const oud=global.fetch,p=require.resolve("../lib/waarschuwingen.cjs");
            delete require.cache[p];global.fetch=fetchImpl;
            try{const h=require(p),r=nepRes();await h({query},r);return r;}
            finally{global.fetch=oud;delete require.cache[p];}
          }
          const headers=len=>({get:n=>String(n).toLowerCase()==="content-length"?String(len):null});
          const legeAtom='<?xml version="1.0"?><feed xmlns="http://www.w3.org/2005/Atom"></feed>';

          (async()=>{
            const snelUrls=[];
            const snel=await roep({lat:"52.35",lon:"5.26",land:"NL"},async url=>{
              snelUrls.push(String(url));
              return{ok:true,headers:headers(1046008),text:async()=>JSON.stringify({warnings:[]})};
            });
            assert.equal(snelUrls.length,1,"kleine compatibiliteitsfeed mag geen onnodige Atom-request starten");
            assert.equal(snel.body.dekking,true);
            assert.equal(snel.body.plaatsSpecifiek,true);

            let atomGestart=false;const grootUrls=[];
            const groot=await roep({lat:"52.52",lon:"13.405",land:"DE"},async url=>{
              const u=String(url);grootUrls.push(u);
              if(u.includes("api/v1/warnings/feeds-"))return{
                ok:true,headers:headers(10504726),text:async()=>{
                  assert.equal(atomGestart,true,"grote compatibiliteitsfeed moet Atom al hedgen vóór de body is verwerkt");
                  return JSON.stringify({warnings:[{event:"Storm",severity:"Moderate",area:[{polygon:"52.0,13.0 52.0,14.0 53.0,14.0 53.0,13.0"}]}]});
                }
              };
              atomGestart=true;
              return{ok:true,headers:headers(100),text:async()=>legeAtom};
            });
            assert.equal(grootUrls.length,2,"grote compatibiliteitsfeed start precies één hedged Atom-request");
            assert.equal(groot.body.plaatsSpecifiek,true,"geldige compatibiliteitsdata blijft ondanks hedge leidend");
            assert.equal(groot.body.lijst.length,1);
            assert.equal(groot.body.lijst[0].titel,"Storm");

            let atomVoorFallback=false;const fallbackUrls=[];
            const fallback=await roep({lat:"52.52",lon:"13.405",land:"DE"},async url=>{
              const u=String(url);fallbackUrls.push(u);
              if(u.includes("api/v1/warnings/feeds-"))return{
                ok:true,headers:headers(10504726),text:async()=>{
                  assert.equal(atomVoorFallback,true,"Atom moet al lopen voordat een grote onbruikbare compatibiliteitsbody terugvalt");
                  return "geen json";
                }
              };
              atomVoorFallback=true;
              return{ok:true,headers:headers(100),text:async()=>legeAtom};
            });
            assert.equal(fallbackUrls.length,2);
            assert.equal(fallback.body.dekking,true,"lege officiële Atom-feed mag nog steeds nul actieve waarschuwingen bewijzen");
            assert.equal(fallback.body.plaatsSpecifiek,false);
            assert.deepEqual(fallback.body.lijst,[]);

            const bron=require("fs").readFileSync(require("path").join(__dirname,"..","lib","waarschuwingen.cjs"),"utf8");
            assert.ok(bron.includes("METEO_HEDGE_HEADER_MS = 1500"));
            assert.ok(bron.includes("if (!compatHeadersOntvangen) void startAtom()"),"trage responseheaders starten dezelfde lazy fallback vroeg");
            console.log("Warning upstream hedge: normale feed enkelvoudig; grote/trage feed hedged; geldige compatibiliteitsdata blijft leidend.");
          })().catch(err=>{console.error(err&&err.stack||err);process.exitCode=1;});
          ''')
          PY
          node --check lib/waarschuwingen.cjs
          node scripts/warning-upstream-hedge.test.js
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/waarschuwingen.cjs prelaunch-regressions.test.js package.json scripts/warning-upstream-hedge.test.js
          git commit -m 'Hedge trage MeteoAlarm fallback zonder scopeverlies'
          git push origin HEAD:hardening/warning-fallback-hedge-20260830
