name: Volledige WeatherNow-codecontrole

on:
  push:
    branches:
      - agent/extrema-radar-status
    paths:
      - .github/workflows/final-code-audit.yml

permissions:
  contents: write

jobs:
  audit-fix-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extrema-radar-status
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pas gecontroleerde correcties toe
        run: python .github/final-audit.py

      - name: Controleer alle handgeschreven code en data
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './.github/*' -print0)
          python - <<'PY'
          from pathlib import Path
          import json, re
          html=Path('index.html').read_text()
          scripts='\n'.join(re.findall(r'<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)</script>',html))
          Path('/tmp/index-inline.js').write_text(scripts)
          for f in ['package.json','manifest.json','lettermaten.json']:
              json.loads(Path(f).read_text())
          PY
          node --check /tmp/index-inline.js
          node run.js | tee /tmp/weathernow-tests.log
          ! grep -q 'FOUT' /tmp/weathernow-tests.log

      - name: Leg alleen de gecontroleerde bronwijzigingen vast
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/final-audit.py .github/workflows/final-code-audit.yml
          git config user.name "WeatherNow Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rond WeatherNow af na volledige codecontrole"
          git push origin HEAD:agent/extrema-radar-status
