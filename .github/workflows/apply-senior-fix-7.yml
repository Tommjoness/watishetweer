name: Apply senior fix 7
on:
  push:
    branches:
      - agent/senior-fix-7-auditpunten
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[senior-fix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/senior-fix-7-auditpunten
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-senior-fix-7.js
      - run: npm test
      - run: git diff --check
      - name: Commit canonical source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Rond zeven senior-auditpunten af [senior-fix-applied]"
          git push origin HEAD:agent/senior-fix-7-auditpunten
