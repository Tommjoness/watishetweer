name: Herstel neerslagconsistentie

on:
  push:
    branches:
      - agent/neerslag-consistentie

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/neerslag-consistentie
          fetch-depth: 0

      - name: Pas neerslaglogica en labels gericht aan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          def vervang(oud, nieuw, naam):
              global s
              n = s.count(oud)
              if n != 1:
                  raise SystemExit(f'{naam}: verwacht 1 overeenkomst, gevonden {n}')
              s = s.replace(oud, nieuw, 1)

          vervang(
              '<div class="stat"><div class="eyebrow">Neerslagkans komend uur</div><div class="sval" id="pop">--</div><div class="ssub" id="popsub">&nbsp;</div></div>',
              '<div class="stat"><div class="eyebrow" id="poplabel">Neerslagkans komend uur</div><div class="sval" id="pop">--</div><div class="ssub" id="popsub">&nbsp;</div></div>',
              'dynamisch uurkanslabel'
          )

          vervang(
              'const hhmm=s=>s.slice(11,16);\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));',
              '''const hhmm=s=>s.slice(11,16);
/* Open-Meteo koppelt een uurkans aan het uur dat op het tijdstip eindigt.
   20:00 betekent dus 19:00-20:00. Deze helper maakt dat tijdvak expliciet
   zonder de tijdzone van het apparaat te gebruiken. */
const vorigUur=s=>{
  const d=new Date(s.slice(0,16)+":00Z");
  d.setUTCHours(d.getUTCHours()-1);
  return d.toISOString().slice(11,16);
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));''',
              'helper voorafgaand uur'
          )

          vervang(
              '''  const popKomendUur=h.precipitation_probability[i+1]??0;
  set("pop",popKomendUur+"<s>%</s>");
  zetTekst("popsub", popKomendUur<20
    ? "Komend uur is de neerslagkans zeer klein."
    : "Komend uur is de neerslagkans "+Math.round(popKomendUur)+"%.");''',
              '''  /* Het Open-Meteo-tijdstip is het einde van het kansvenster:
     de waarde bij 20:00 beschrijft 19:00-20:00. Daarom gebruiken we i+1
     en benoemen we het eindtijdstip zichtbaar, in plaats van een los percentage. */
  const popEind=h.time[i+1]||null;
  const popKomendUur=popEind!=null?(h.precipitation_probability[i+1]??0):null;
  document.getElementById("poplabel").textContent=popEind
    ? "Neerslagkans tot "+hhmm(popEind)
    : "Neerslagkans komend uur";
  set("pop",popKomendUur==null?"–":Math.round(popKomendUur)+"<s>%</s>");
  zetTekst("popsub", popKomendUur==null ? "Geen uurverwachting beschikbaar."
    : popKomendUur<20 ? "Voor het lopende uur is de kans zeer klein."
    : "Voor het lopende uur is de kans "+Math.round(popKomendUur)+"%.");''',
              'uurkans met expliciet tijdvak'
          )

          vervang(
              '''    const dagKans=day.precipitation_probability_max&&day.precipitation_probability_max[0];
    if(dagKans!=null&&isFinite(dagKans)&&dagKans>=25){
      zin1 += " Later vandaag is de neerslagkans <b>"+Math.round(dagKans)+"%</b>.";
    }''',
              '''    /* Niet het maximum van de hele kalenderdag gebruiken: dat kan
       een kans van eerder vandaag zijn. restkans() kijkt alleen vanaf nu. */
    const resterendeKans=restkans();
    if(resterendeKans>=25){
      zin1 += " Later vandaag is de hoogste neerslagkans nog <b>"+resterendeKans+"%</b>.";
    }''',
              'alleen resterende dagkans in briefing'
          )

          vervang(
              '    P.push(h.precipitation_probability[i]??0);MM.push(h.precipitation[i]??0);',
              '''    /* De waarde op het eerste zichtbare hele uur hoort bij het
       voorafgaande, inmiddels verstreken uur. In de vooruitblik tonen we die
       daarom niet als toekomstige kans of hoeveelheid. */
    const verstrekenInterval=S.dag==null&&start===S.i0&&k===0;
    P.push(verstrekenInterval?null:(h.precipitation_probability[i]??0));
    MM.push(verstrekenInterval?null:(h.precipitation[i]??0));''',
              'verstreken eerste uur uit vooruitblik'
          )

          vervang(
              '''      if(P[i]>0) ticks+=`<text x="${x(i)}" y="${pb+(M?35:37)}" text-anchor="middle" fill="${TEAL}" font-family="DM Mono,monospace" font-size="${F.pre}">${P[i]}%</text>`;''',
              '''      /* Lage losse percentages onder de grafiek ogen als een
         tegenstrijdige hoofdverwachting. Alleen een duidelijke kans of een
         daadwerkelijk berekende hoeveelheid krijgt daar nog een cijfer. */
      if((P[i]??0)>=40||(MM[i]??0)>=0.1) ticks+=`<text x="${x(i)}" y="${pb+(M?35:37)}" text-anchor="middle" fill="${TEAL}" font-family="DM Mono,monospace" font-size="${F.pre}">${P[i]}%</text>`;''',
              'rustige kanslabels onder grafiek'
          )

          vervang(
              '''      +rij("neerslagkans",(heel(G.P&&G.P[i])?G.P[i]:"–")+"%",TEAL)''',
              '''      +rij(heel(G.P&&G.P[i])?"kans "+vorigUur(G.TI[i])+"–"+G.TI[i].slice(11,16):"neerslagkans",
        heel(G.P&&G.P[i])?G.P[i]+"%":"–",TEAL)''',
              'tijdvak in grafiektooltip'
          )

          p.write_text(s)
          PY

      - name: Controleer syntax, bestaande suite en regressies
        shell: bash
        run: |
          node run.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          eisen=[
            'Neerslagkans tot "+hhmm(popEind)',
            'const resterendeKans=restkans();',
            'const verstrekenInterval=S.dag==null&&start===S.i0&&k===0;',
            '"kans "+vorigUur(G.TI[i])+"–"+G.TI[i].slice(11,16)',
          ]
          for e in eisen:
              assert e in s, e
          assert 'const dagKans=day.precipitation_probability_max' not in s
          PY

      - name: Commit gecontroleerde correctie
        shell: bash
        run: |
          rm .github/workflows/fix-neerslag-consistentie.yml
          git config user.name "WeatherNow Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maak neerslagkansen tijdgebonden en consistent"
          git push origin HEAD:agent/neerslag-consistentie
