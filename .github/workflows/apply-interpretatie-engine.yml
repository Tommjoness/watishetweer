  for(let k=0;k<h.time.length;k++){
    if(h.time[k].slice(0,10)!==dag||WI.minuut(h.time[k])<=WI.minuut(nu)) continue;
    const v=h.precipitation_probability[k];if(v!=null&&isFinite(v))m=m==null?v:Math.max(m,v);
  }
  return m==null?null:Math.round(m);
}
function dagen(){
  const day=S.d.daily,lo=Math.min(...day.temperature_2m_min),hi=Math.max(...day.temperature_2m_max),sp=(hi-lo)||1;
  let out="";
  day.time.forEach((t,i)=>{
    const dt=new Date(t+"T12:00:00"),nr=dt.getDate(),lang=DAGENVOL[dt.getDay()]+" "+nr,kort=DAGEN[dt.getDay()]+" "+nr,nm='<span class="dlang">'+lang+'</span><span class="dkort">'+kort+'</span>';
    const l=day.temperature_2m_min[i],hh=day.temperature_2m_max[i],a=WI.analyseDag(S.d,t,i===0?S.d.current.time:null),code=a.icoonCode==null?day.weather_code[i]:a.icoonCode;
    const kans=i===0?restkans():(a.maximaleKans==null?(day.precipitation_probability_max[i]??null):Math.round(a.maximaleKans)),som=day.precipitation_sum[i];
    out+=`<div class="row day${S.dag===i?" on":""}" data-i="${i}" role="button" tabindex="0">
      <div class="dname">${nm}</div><div class="dico">${icon(code,true,22)}</div>
      <div class="dcond">${a.omschrijving}${som>0?", "+WI.mmTekst(som):""}</div>
      <div class="dwind">${bft(day.wind_speed_10m_max[i]||0)} Bft ${pijl(day.wind_direction_10m_dominant?day.wind_direction_10m_dominant[i]:0,11)}</div>
      <div class="dmin">${Math.round(l)}°</div><div class="bar"><i style="left:${(l-lo)/sp*100}%;width:${Math.max(3,(hh-l)/sp*100)}%"></i></div><div class="dmax">${Math.round(hh)}°</div>
      <div class="drain">${kans==null?"–":kans+"%"}${som>0?`<small>${WI.mmTekst(som)}</small>`:""}</div></div>`;
  });
  const kop=`<div class="row day kop"><div class="dname">Dag</div><div class="dico"></div><div class="dcond">Verwachting</div><div class="dwind">Wind max</div><div class="dmin">Min</div><div class="bar"></div><div class="dmax">Max</div><div class="drain">Hoogste kans</div></div>`;
  const c=document.getElementById("days");c.innerHTML=kop+out;
  c.querySelectorAll(".day:not(.kop)").forEach(el=>{
    const kies=()=>{const i=+el.dataset.i;S.dag=i;let st=S.d.hourly.time.findIndex(t=>t.slice(0,10)===S.d.daily.time[i]);if(st<0)st=S.i0;etmaal(st,24);dagen();document.getElementById("chart").scrollIntoView({behavior:"smooth",block:"center"});};
    el.addEventListener("click",kies);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();kies();}});
  });
}

document.getElementById("back")''','daginterpretatie')

