name: Temporary final UI visual evidence
on:
  push:
    branches:
      - qa/final-ui-visual-evidence-20260902
permissions:
  contents: read
jobs:
  visual-evidence:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Installeer Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Bewijs live 390px en ontbrekende wereldlocaties
        shell: bash
        run: |
          cat > .tmp-final-ui-evidence.js <<'NODE'
          "use strict";
          const fs=require("fs"),assert=require("assert");
          const {chromium}=require("playwright");
          const ROOT="https://watishetweer.nl";
          const SHA="9ae4a5bb35adee34ddd5a3519211834c9c3512f6";
          fs.mkdirSync("screenshots-current",{recursive:true});
          async function openReady(browser,params,viewport){
            let last;
            for(let attempt=1;attempt<=3;attempt++){
              const context=await browser.newContext({viewport,serviceWorkers:"block",locale:"nl-NL",reducedMotion:"reduce"});
              const page=await context.newPage(),errors=[];
              page.on("pageerror",e=>errors.push(String(e)));
              try{
                const sep=params.includes("?")?"&":"?";
                const response=await page.goto(ROOT+"/"+params+sep+"qa_retry="+Date.now()+"_"+attempt,{waitUntil:"domcontentloaded",timeout:60000});
                assert(response&&response.ok(),`HTTP ${response&&response.status()}`);
                await page.waitForSelector("#app",{state:"visible",timeout:30000});
                await page.waitForFunction(()=>document.querySelectorAll("#days .row.day:not(.kop)").length===7,null,{timeout:30000});
                await page.waitForFunction(()=>document.querySelectorAll("#wiw-hour-table tbody tr").length===24,null,{timeout:30000});
                await page.evaluate(()=>document.fonts&&document.fonts.ready);await page.waitForTimeout(700);
                assert.equal(await page.locator('meta[name="weather-build-sha"]').getAttribute("content"),SHA,"verkeerde live SHA");
                return {context,page,errors};
              }catch(e){last=e;await page.screenshot({path:`screenshots-current/retry-${viewport.width}-${attempt}.png`,fullPage:true}).catch(()=>{});await context.close();}
            }
            throw last;
          }
          function compactTruth(){
            const visible=el=>!!el&&el.getClientRects().length>0&&getComputedStyle(el).display!=="none"&&getComputedStyle(el).visibility!=="hidden";
            const compact=document.getElementById("wiw-hour-table"),rows=[...compact.querySelectorAll("tbody tr")];
            const full=[...document.querySelectorAll("details table")].find(t=>t!==compact&&[...t.querySelectorAll("th")].some(h=>/temperatuur/i.test(h.textContent||"")));
            const heads=full?[...full.querySelectorAll("thead th")].map(h=>(h.textContent||"").trim().toLowerCase()):[];
            const ti=heads.findIndex(h=>/^tijd$/.test(h)),te=heads.findIndex(h=>/^temperatuur$/.test(h)),ge=heads.findIndex(h=>/gevoel/.test(h));
            const fullRows=full?[...full.querySelectorAll("tbody tr")].slice(0,24):[];
            const same=fullRows.length===24&&rows.every((r,i)=>{
              const a=[...r.children].map(c=>(c.textContent||"").replace(/\s+/g," ").trim()),b=[...fullRows[i].children].map(c=>(c.textContent||"").replace(/\s+/g," ").trim());
              return a[0]===b[ti]&&a[1]===b[te]&&a[2]===b[ge];
            });
            return {overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-document.documentElement.clientWidth,rows:rows.length,same,pressure:[...document.querySelectorAll(".eyebrow")].filter(visible).some(e=>/Luchtdruk/.test(e.textContent||"")),more:[...document.querySelectorAll("summary,h2,h3")].filter(visible).some(e=>/Meer meetgegevens/.test(e.textContent||"")),hour:!!document.getElementById("wiw-hour-panel"),rain:!!document.getElementById("wiw-rain-summary"),tz:(document.getElementById("coords")?.textContent||"").split(" · ").at(-1)};
          }
          (async()=>{const browser=await chromium.launch({headless:true});try{
            const ams=await openReady(browser,"?lat=52.3676&lon=4.9041&plaats=Amsterdam&land=NL",{width:390,height:844});
            const m=await ams.page.evaluate(compactTruth);
            assert(m.overflow<=1,`390px overflow ${m.overflow}`);assert.equal(m.rows,24);assert.equal(m.same,true,"compacte 24-uurswaarden wijken af van volledige tabel");assert.equal(m.pressure,false);assert.equal(m.more,false);assert.equal(m.hour,true);assert.equal(m.rain,true);
            await ams.page.screenshot({path:"screenshots-current/after-390.png",fullPage:true});assert.deepEqual(ams.errors,[],`390 pageerrors ${ams.errors.join(" | ")}`);await ams.context.close();
            const report={sha:SHA,mobile390:m,world:[]};
            for(const loc of [{name:"Kansas City",country:"US",lat:39.0997,lon:-94.5786,tz:"America/Chicago"},{name:"Kathmandu",country:"NP",lat:27.7172,lon:85.3240,tz:"Asia/Kathmandu"}]){
              for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
                const x=await openReady(browser,`?lat=${loc.lat}&lon=${loc.lon}&plaats=${encodeURIComponent(loc.name)}&land=${loc.country}`,viewport);const o=await x.page.evaluate(compactTruth);
                assert.equal(o.tz,loc.tz,`${loc.name}: ${o.tz}`);assert(o.overflow<=1,`${loc.name}/${viewport.width}: overflow ${o.overflow}`);assert.equal(o.rows,24);assert.equal(o.same,true,`${loc.name}/${viewport.width}: uurwaarden verschillen`);assert.equal(o.pressure,false);assert.equal(o.more,false);assert.deepEqual(x.errors,[],`${loc.name}/${viewport.width}: pageerrors ${x.errors.join(" | ")}`);
                report.world.push({location:loc.name,width:viewport.width,timezone:o.tz,rows:o.rows,overflow:o.overflow});await x.context.close();
              }
            }
            fs.writeFileSync("screenshots-current/report.json",JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          }finally{await browser.close();}})().catch(e=>{console.error(e&&e.stack||e);process.exit(1);});
          NODE
          node .tmp-final-ui-evidence.js
      - name: Upload bewijs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ui-current-mobile-evidence
          path: screenshots-current/
          if-no-files-found: error
          retention-days: 7
