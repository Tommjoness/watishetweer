name: Release recovery verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-build-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installeer builddependencies
        run: npm install --ignore-scripts
      - name: Installeer Chromium-driver voor gerichte hersteltest
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Bouw exact herstelartifact
        env:
          WEATHER_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build:cloudflare
      - name: Controleer één hoofdclient op alle app-routes
        run: node scripts/release-bundle-consistency.test.js
      - name: Test no-JS, failed-JS, refresh en BFCache
        run: node browser-release-recovery-20260904.test.js
