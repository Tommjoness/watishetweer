name: Release recovery verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-build-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installeer builddependencies
        run: npm ci --ignore-scripts
      - name: Controleer recovery- en productiescripts syntactisch
        run: |
          node --check browser-release-recovery-20260904.test.js
          node --check browser-serviceworker-upgrade.test.js
          node --check scripts/production-release-recovery.js
          node --check scripts/production-release-recovery-browser.js
          node --check scripts/production-release-recovery-navigation.js
          node --check scripts/native-reload-driver-browser.js
      - name: Installeer native browserreload-driver (vastgepind, zonder pakketserver)
        # Twee officiële Ubuntu 24.04-pakketten uit de repository in plaats van apt-get (scripts/ci/native-reload-driver/README.md).
        # De SHA-256 staat in deze workflow en wordt vóór de installatie gecontroleerd; alleen deze twee bestanden worden geïnstalleerd.
        working-directory: scripts/ci/native-reload-driver
        run: |
          set -eu
          sha256sum --check --strict - <<'SHA256'
          3506c2824a74255439813f824a1629387452d52c6efd6d7916b8b54e458175e8  libxdo3_3.20160805.1-5build1_amd64.deb
          58a202c74bce31ca2d72d4d514942a5ab6191932696adc5d21d909c9216b13cb  xdotool_3.20160805.1-5build1_amd64.deb
          SHA256
          dpkg --install libxdo3_3.20160805.1-5build1_amd64.deb xdotool_3.20160805.1-5build1_amd64.deb
          command -v xdotool
      - name: Bewijs native focus, Ctrl+R en offline serviceworker-reload met de vastgepinde driver
        run: xvfb-run --auto-servernum node scripts/native-reload-driver-browser.js
      - name: Bouw exact herstelartifact
        env:
          WEATHER_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -o pipefail
          npm run build:cloudflare 2>&1 | tee release-recovery-build.log
      - name: Controleer één hoofdclient op alle app-routes
        shell: bash
        run: |
          set -o pipefail
          node scripts/release-bundle-consistency.test.js 2>&1 | tee release-recovery-static.log
      - name: Test no-JS, failed-JS, refresh en BFCache
        shell: bash
        run: |
          set -o pipefail
          xvfb-run --auto-servernum node browser-release-recovery-20260904.test.js 2>&1 | tee release-recovery-browser.log
      - name: Test actuele offline serviceworker-generatie
        shell: bash
        run: |
          set -o pipefail
          node browser-serviceworker-upgrade.test.js 2>&1 | tee release-recovery-serviceworker.log
      - name: Bewaar hersteltestdiagnostiek
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-recovery-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-recovery-*.log
          if-no-files-found: warn
          retention-days: 7
