name: WeatherNow eindronde checkpoint

on:
  pull_request:
    branches: [main]

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Installeer dependencies
        run: npm ci
      - name: Pure en buildregressies
        run: npm test
      - name: Installeer echte browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Bouw definitieve artifact
        run: npm run build && npm run postbuild
      - name: Checkpoint 25% in Chromium en WebKit
        run: node browser-q1-checkpoint.test.js
