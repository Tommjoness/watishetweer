name: WeatherNow eindronde checkpoint

on:
  pull_request:
    branches: [main]

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Pure en buildregressies
        run: npm test
      - name: Installeer echte browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Bouw definitieve artifact
        run: npm run build
      - name: Checkpoint 25% in Chromium en WebKit
        run: |
          node -e 'const fs=require("fs"),p="browser-q1-checkpoint.test.js";let s=fs.readFileSync(p,"utf8");const n="assert.ok(Number.isFinite(snel.paint)&&snel.paint<150,naam+\": gecachte paint is gemeten en <150 ms\");";if(!s.includes(n))throw new Error("cachepaint-assertie niet gevonden");s=s.replace(n,"console.log(\"CACHEPERF \"+naam+\" \"+JSON.stringify(snel));\n    "+n);fs.writeFileSync(p,s);'
          node browser-q1-checkpoint.test.js
