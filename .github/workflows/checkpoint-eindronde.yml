name: WeatherNow eindronde checkpoint

on:
  pull_request:
    branches: [main]

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Pure en buildregressies
        run: npm test
      - name: Installeer echte browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Bouw definitieve artifact
        run: npm run build
      - name: Finale 27-punten artifactcontrole
        run: node scripts/verify-final-27.js
      - name: Pooldag en poolnacht in Chromium en WebKit
        run: node browser-polar-solar.test.js
      - name: Weergave en favicon in Chromium en WebKit
        run: node browser-ui-shell-playwright.test.js
      - name: Tijdzones en fallback in Chromium en WebKit
        run: node browser-timezone-hardening.test.js
      - name: Cold-load browser-performancebudget
        run: node browser-performance-budget.test.js
      - name: Checkpoint 25% in Chromium en WebKit
        run: node browser-q1-checkpoint.test.js
      - name: Checkpoint 50% in Chromium en WebKit
        run: node browser-q2-checkpoint.test.js
      - name: Checkpoint 75% in Chromium en WebKit
        run: node browser-q3-checkpoint.test.js
      - name: Checkpoint 100% in Chromium en WebKit
        run: node browser-q4-checkpoint.test.js
      - name: Regenperioden, hover en uitlijning in Chromium en WebKit
        shell: bash
        run: |
          set +e
          node browser-q4-rain-periods.test.js > /tmp/rain-e2e.log 2>&1
          code=$?
          cat /tmp/rain-e2e.log
          if [ "$code" -ne 0 ]; then
            msg="$(tail -n 30 /tmp/rain-e2e.log | tr '\n\r' '  ' | sed 's/%/%25/g; s/::/%3A%3A/g')"
            echo "::error file=browser-q4-rain-periods.test.js,line=1::$msg"
            exit "$code"
          fi
      - name: Serviceworker upgrade en offline in Chromium
        shell: bash
        run: |
          set +e
          node browser-serviceworker-upgrade.test.js > /tmp/sw-e2e.log 2>&1
          code=$?
          cat /tmp/sw-e2e.log
          if [ "$code" -ne 0 ]; then
            msg="$(tail -n 20 /tmp/sw-e2e.log | tr '\n\r' '  ' | sed 's/%/%25/g; s/::/%3A%3A/g')"
            echo "::error file=browser-serviceworker-upgrade.test.js,line=1::$msg"
            exit "$code"
          fi
