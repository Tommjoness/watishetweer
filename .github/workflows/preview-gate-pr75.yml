name: WeatherNow mobile week preview gate PR75

on:
  push:
    branches: [agent/mobile-week-preview-20260814]

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Toon Chrome-versie
        run: google-chrome --version
      - name: Installeer Playwright en WebKit
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps webkit
      - name: Controleer PR75-preview op 390, 360 en 320 px in Chromium en WebKit
        env:
          PREVIEW_URL: "https://weathernow-75vzd467l-tommjoness-projects.vercel.app/?_vercel_share=9fFgTRo51wyeDNjU83IMtbsOrq4C6QO7&lat=52.3500&lon=5.2600&plaats=Almere&land=NL"
        run: |
          cat > .preview-gate-pr75.js <<'NODE'
          "use strict";
          const assert=require("assert");
          const {chromium,webkit}=require("playwright");
          const url=process.env.PREVIEW_URL;
          if(!url)throw new Error("PREVIEW_URL ontbreekt");
          const doelen=[
            ["390",{width:390,height:844}],
            ["360",{width:360,height:800}],
            ["320",{width:320,height:700}]
          ];
          const engines=[
            ["chromium",()=>chromium.launch({headless:true,channel:"chrome"})],
            ["webkit",()=>webkit.launch({headless:true})]
          ];

          async function controle(browser,engine,naam,viewport){
            const context=await browser.newContext({viewport,serviceWorkers:"block"});
            const page=await context.newPage();
            const fouten=[];
            page.on("pageerror",e=>fouten.push("pageerror: "+String(e)));
            page.on("console",m=>{if(m.type()==="error")fouten.push("console: "+m.text());});
            try{
              const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:45000});
              assert(response,`${engine}-${naam}: geen navigatieresponse`);
              assert(response.status()<400,`${engine}-${naam}: HTTP ${response.status()}`);
              await page.waitForSelector("#app",{state:"visible",timeout:30000});
              await page.waitForSelector("#days .row.day:not(.kop)",{state:"visible",timeout:30000});
              await page.waitForFunction(()=>{
                const t=document.querySelector("#t"),c=document.querySelector("#cond");
                return t&&c&&t.textContent.trim()&&!/[–—]/.test(t.textContent)&&c.textContent.trim();
              },null,{timeout:30000});
              await page.waitForTimeout(900);

              const r=await page.evaluate(()=>{
                const rows=[...document.querySelectorAll("#days .row.day")];
                const first=document.querySelector("#days .row.day:not(.kop)");
                const css=(sel)=>{const el=first&&first.querySelector(sel);return el?getComputedStyle(el):null;};
                const dname=css(".dname"),dwind=css(".dwind"),drain=css(".drain"),dmin=css(".dmin"),dmax=css(".dmax");
                return {
                  href:location.href,
                  width:innerWidth,
                  documentWidth:document.documentElement.scrollWidth,
                  days:document.querySelectorAll("#days .row.day:not(.kop)").length,
                  nameFont:dname?.fontSize||null,
                  windFont:dwind?.fontSize||null,
                  windDisplay:dwind?.display||null,
                  rainFont:drain?.fontSize||null,
                  minFont:dmin?.fontSize||null,
                  maxFont:dmax?.fontSize||null,
                  rowOverflow:rows.some(el=>el.scrollWidth>el.clientWidth+1),
                  rowOutside:rows.some(el=>{const b=el.getBoundingClientRect();return b.left<-1||b.right>innerWidth+1;}),
                  stateVisible:document.querySelector("#state")?getComputedStyle(document.querySelector("#state")).display!=="none":false
                };
              });

              assert(r.href.includes("weathernow-75vzd467l-tommjoness-projects.vercel.app"),`${engine}-${naam}: onverwachte eind-URL ${r.href}`);
              assert(r.days>=7,`${engine}-${naam}: weekweergave onvolledig: ${r.days}`);
              assert(r.documentWidth<=r.width+2,`${engine}-${naam}: horizontale pagina-overflow ${r.documentWidth} > ${r.width}`);
              assert.equal(r.rowOverflow,false,`${engine}-${naam}: weekrij heeft interne overflow`);
              assert.equal(r.rowOutside,false,`${engine}-${naam}: weekrij valt buiten viewport`);
              assert.equal(r.stateVisible,false,`${engine}-${naam}: loading/foutstate bleef zichtbaar`);
              assert.equal(r.nameFont,"13.5px",`${engine}-${naam}: dagnaam ${r.nameFont}`);
              assert.equal(r.rainFont,"13px",`${engine}-${naam}: neerslag ${r.rainFont}`);
              assert.equal(r.minFont,"14px",`${engine}-${naam}: min ${r.minFont}`);
              assert.equal(r.maxFont,"14px",`${engine}-${naam}: max ${r.maxFont}`);
              if(viewport.width>370){
                assert.notEqual(r.windDisplay,"none",`${engine}-${naam}: wind onverwacht verborgen`);
                assert.equal(r.windFont,"13px",`${engine}-${naam}: wind ${r.windFont}`);
              }else{
                assert.equal(r.windDisplay,"none",`${engine}-${naam}: wind hoort onder 370 px verborgen te zijn`);
              }
              assert.deepEqual(fouten,[],`${engine}-${naam}: browserfouten: ${fouten.join(" | ")}`);
              await page.locator("#days").screenshot({path:`week-${engine}-${naam}.png`});
              if(naam==="390")await page.screenshot({path:`full-${engine}-390.png`,fullPage:true});
              console.log(`${engine}-${naam} groen: ${JSON.stringify(r)}`);
            }finally{await context.close();}
          }

          (async()=>{
            for(const [engine,start] of engines){
              const browser=await start();
              try{for(const [naam,viewport] of doelen)await controle(browser,engine,naam,viewport);}
              finally{await browser.close();}
            }
            console.log("PR75 mobiele week-previewgate volledig groen in Chromium en WebKit.");
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE
          node .preview-gate-pr75.js
      - name: Bewaar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr75-week-preview-screenshots
          path: |
            week-*.png
            full-*.png
          if-no-files-found: warn
          retention-days: 1
