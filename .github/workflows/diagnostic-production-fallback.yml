name: WeatherNow production fallback diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-controlled:
    name: Gedeployde fallbackcode Chromium + WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Bewijs gedeployde 5s hedge op root en www
        run: |
          cat > /tmp/production-controlled.js <<'NODE'
          "use strict";
          const { chromium, webkit } = require("playwright");
          const { bouw } = require(process.cwd()+"/data.js");
          const domains = [
            ["root","https://watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL"],
            ["www","https://www.watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL"]
          ];
          const engines = [["Chromium",chromium],["WebKit",webkit]];
          function dataset(temp){
            const d=bouw({tempNu:temp,wcNu:1,ccNu:20});
            d.current.interval=900;d.current.visibility=18000;d.elevation=2;
            d.latitude=52.3702;d.longitude=4.8952;
            d.daily.sunshine_duration=d.daily.time.map(()=>7*3600);
            return d;
          }
          const payloads={
            full:dataset(11),fallback:dataset(22),
            preview:{timezone:"Europe/Amsterdam",current:{temperature_2m:12,apparent_temperature:12,is_day:1,weather_code:1}},
            air:{current:{european_aqi:18,us_aqi:35},hourly:{time:[dataset(11).current.time],alder_pollen:[0],birch_pollen:[0],grass_pollen:[0],mugwort_pollen:[0],ragweed_pollen:[0],olive_pollen:[0]}}
          };
          function installStub({payloads,config}){
            try{localStorage.clear();sessionStorage.clear();}catch(e){}
            window.__hedgeProbe={full:0,fallback:0,fallbackStart:-1,start:performance.now()};
            const answer=(payload,ok=true,status=200)=>({ok,status,json:async()=>payload,text:async()=>JSON.stringify(payload)});
            const later=(ms,payload,signal,mode)=>new Promise((resolve,reject)=>{
              let timer=null,done=false;
              const stop=()=>{if(timer!==null){clearTimeout(timer);timer=null;}};
              const abort=()=>{if(done)return;done=true;stop();reject(new DOMException("Fetch is aborted","AbortError"));};
              if(signal){if(signal.aborted)return abort();signal.addEventListener("abort",abort,{once:true});}
              if(mode==="hang")return;
              timer=setTimeout(()=>{if(done)return;done=true;if(signal)signal.removeEventListener("abort",abort);resolve(answer(payload));},ms);
            });
            window.fetch=function(input,opt){
              const u=typeof input==="string"?input:(input&&input.url)||String(input||"");
              const signal=opt&&opt.signal;
              if(u.includes("/api/waarschuwingen"))return Promise.resolve(answer({bron:"test",dekking:true,lijst:[]}));
              if(u.includes("/api/plaatsnaam"))return Promise.resolve(answer({naam:"Amsterdam",land:"NL",bron:"test"}));
              if(u.includes("geocoding-api.open-meteo.com"))return Promise.resolve(answer({results:[]}));
              if(u.includes("air-quality-api.open-meteo.com"))return later(25,payloads.air,signal,"ok");
              if(u.includes("api.open-meteo.com/v1/forecast")){
                const preview=u.includes("current=temperature_2m,apparent_temperature,is_day,weather_code")&&!u.includes("daily=");
                const full=u.includes("minutely_15=");
                const fallback=!preview&&!full&&u.includes("daily=");
                if(preview)return later(20,payloads.preview,signal,"ok");
                if(full){window.__hedgeProbe.full++;return later(config.fullMs,payloads.full,signal,config.fullMode);}
                if(fallback){window.__hedgeProbe.fallback++;if(window.__hedgeProbe.fallbackStart<0)window.__hedgeProbe.fallbackStart=performance.now()-window.__hedgeProbe.start;return later(config.fallbackMs,payloads.fallback,signal,config.fallbackMode);}
              }
              return Promise.resolve(answer({}));
            };
            try{Object.defineProperty(navigator,"geolocation",{value:undefined,configurable:true});}catch(e){}
          }
          async function controlled(browser,engine,domain,url,config,viewport={width:390,height:844}){
            const context=await browser.newContext({viewport});
            const page=await context.newPage();
            const pageErrors=[];page.on("pageerror",e=>pageErrors.push(String(e)));
            await page.addInitScript(installStub,{payloads,config});
            const started=Date.now();
            try{
              const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
              if(!response||response.status()>=400)throw new Error(`HTTP ${response&&response.status()}`);
              let outcome;
              if(config.error){
                await page.waitForFunction(expected=>{const s=document.getElementById("state");return !!(s&&getComputedStyle(s).display!=="none"&&s.textContent.trim()===expected);},config.error,{timeout:18000});
                outcome={error:(await page.locator("#state").textContent()).trim()};
              }else{
                await page.waitForFunction(expected=>typeof S!=="undefined"&&S.d&&S.d.current&&Math.round(Number(S.d.current.temperature_2m))===expected&&document.querySelectorAll("#days .row.day:not(.kop)").length>=7,config.temp,{timeout:12000});
                if(config.settle)await page.waitForTimeout(config.settle);
                outcome=await page.evaluate(()=>({temp:Math.round(Number(S.d.current.temperature_2m)),days:document.querySelectorAll("#days .row.day:not(.kop)").length,nights:document.querySelectorAll("#nights .row.night:not(.kop)").length,docWidth:document.documentElement.scrollWidth,viewportWidth:innerWidth,finalUrl:location.href}));
              }
              const elapsed=Date.now()-started;
              const probe=await page.evaluate(()=>window.__hedgeProbe);
              if(pageErrors.length)throw new Error(`pageerror=${pageErrors.join(" | ")}`);
              if(probe.fallback!==config.fallback)throw new Error(`fallback=${probe.fallback}, verwacht ${config.fallback}`);
              if(config.hedge&&!(probe.fallbackStart>=4700&&probe.fallbackStart<=5500))throw new Error(`fallbackStart=${probe.fallbackStart}`);
              if(config.maxMs&&elapsed>config.maxMs)throw new Error(`te laat ${elapsed}ms`);
              if(config.minMs&&elapsed<config.minMs)throw new Error(`te vroeg ${elapsed}ms`);
              if(outcome.docWidth&&outcome.docWidth>outcome.viewportWidth+1)throw new Error(`overflow=${outcome.docWidth}/${outcome.viewportWidth}`);
              if(outcome.days!=null&&outcome.days<7)throw new Error(`onvolledig=${JSON.stringify(outcome)}`);
              console.log(`${engine}/${domain}/${config.name}/${viewport.width}: OK elapsed=${elapsed}ms fallbackStart=${Math.round(probe.fallbackStart)}ms full=${probe.full} fallback=${probe.fallback} outcome=${JSON.stringify(outcome)}`);
            }finally{await context.close();}
          }
          (async()=>{
            for(const [engine,launcher] of engines){
              const browser=await launcher.launch({headless:true});
              try{
                for(const [domain,url] of domains){
                  await controlled(browser,engine,domain,url,{name:"fast-full",fullMode:"ok",fullMs:120,fallbackMode:"ok",fallbackMs:120,temp:11,fallback:0,settle:5300,maxMs:8000});
                  await controlled(browser,engine,domain,url,{name:"slow-full-fallback",fullMode:"hang",fullMs:0,fallbackMode:"ok",fallbackMs:180,temp:22,fallback:1,hedge:true,maxMs:8500});
                }
                await controlled(browser,engine,"root",domains[0][1],{name:"both-hang",fullMode:"hang",fullMs:0,fallbackMode:"hang",fallbackMs:0,error:"Het ophalen duurt te lang. Controleer je verbinding en probeer het opnieuw.",fallback:1,hedge:true,minMs:14200,maxMs:17500});
                await controlled(browser,engine,"root-desktop",domains[0][1],{name:"fast-full",fullMode:"ok",fullMs:120,fallbackMode:"ok",fallbackMs:120,temp:11,fallback:0,settle:300,maxMs:3500},{width:1440,height:900});
              }finally{await browser.close();}
            }
            console.log("Gedeployde productiecode: root+www, Chromium+WebKit, mobile+desktop, 5s hedge en ~15s dubbele timeout deterministisch geslaagd.");
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1);});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/production-controlled.js

  provider-observation:
    name: Open-Meteo live observatie (niet-gating)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Installeer Chromium en WebKit
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Observeer actuele providerbeschikbaarheid
        continue-on-error: true
        run: |
          cat > /tmp/provider-observation.js <<'NODE'
          "use strict";
          const {chromium,webkit}=require("playwright");
          const urls=[["root","https://watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL"],["www","https://www.watishetweer.nl/?lat=52.3702&lon=4.8952&plaats=Amsterdam&land=NL"]];
          async function attempt(browser,engine,domain,url,i,viewport){
            const context=await browser.newContext({viewport});const page=await context.newPage();
            try{
              const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
              if(!response||response.status()>=400)throw new Error(`HTTP ${response&&response.status()}`);
              const outcome=await Promise.race([
                page.waitForFunction(()=>{const app=document.getElementById("app"),state=document.getElementById("state"),days=document.querySelectorAll("#days .row.day:not(.kop)").length;if(app&&getComputedStyle(app).display!=="none"&&days>=7)return "loaded";const t=state&&getComputedStyle(state).display!=="none"?state.textContent.trim():"";if(t&&/mislukt|duurt te lang|probeer het opnieuw|geen verbinding|fout/i.test(t))return "error:"+t;return false;},{timeout:18000}).then(h=>h.jsonValue()),
                new Promise(r=>setTimeout(()=>r("timeout"),19000))
              ]);
              console.log(`${engine}/${domain}/${viewport.width}/attempt-${i}: ${outcome}`);return outcome==="loaded";
            }catch(e){console.log(`${engine}/${domain}/${viewport.width}/attempt-${i}: exception ${e.message}`);return false;}
            finally{await context.close();}
          }
          (async()=>{
            for(const [engine,launcher] of [["Chromium",chromium],["WebKit",webkit]]){
              const browser=await launcher.launch({headless:true});
              try{
                for(const [domain,url] of urls){let ok=0;for(let i=1;i<=3;i++)if(await attempt(browser,engine,domain,url,i,{width:390,height:844}))ok++;console.log(`${engine}/${domain}/390: ${ok}/3 live loads`);}
                let desk=0;for(let i=1;i<=2;i++)if(await attempt(browser,engine,"root-desktop",urls[0][1],i,{width:1440,height:900}))desk++;console.log(`${engine}/root/1440: ${desk}/2 live loads`);
              }finally{await browser.close();}
            }
          })().catch(e=>{console.error(e&&e.stack||e);process.exitCode=0;});
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/provider-observation.js
