name: Cloudflare domain diagnose

on:
  push:
    branches: [ops/cloudflare-domain-diagnose-20260826]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: watishetweer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cloudflare custom-domainstatus
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT/domains"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$API" -o /tmp/domains.json
          jq -e '.success == true' /tmp/domains.json >/dev/null
          echo '=== Pages custom domains ==='
          jq -r '.result[] | {name,status,verification_data,validation_data,zone_tag} | @json' /tmp/domains.json

          echo '=== Detail per domein ==='
          for domain in watishetweer.nl www.watishetweer.nl; do
            encoded="$(printf '%s' "$domain" | jq -sRr @uri)"
            curl -fsS "${auth[@]}" "$API/$encoded" -o "/tmp/domain-${domain//./-}.json"
            jq -e '.success == true' "/tmp/domain-${domain//./-}.json" >/dev/null
            jq -r '.result | {name,status,verification_data,validation_data,error_message,zone_tag} | @json' "/tmp/domain-${domain//./-}.json"
          done

      - name: Publieke DNS
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns=require('node:dns').promises;
          async function one(name){
            console.log(`=== DNS ${name} ===`);
            for (const [label,fn] of [
              ['NS',()=>dns.resolveNs(name)],
              ['A',()=>dns.resolve4(name)],
              ['AAAA',()=>dns.resolve6(name)],
              ['CNAME',()=>dns.resolveCname(name)],
              ['TXT',()=>dns.resolveTxt(name)],
              ['MX',()=>dns.resolveMx(name)],
              ['CAA',()=>dns.resolveCaa(name)],
            ]) {
              try { console.log(label, JSON.stringify(await fn())); }
              catch(e){ console.log(label, `ERROR ${e.code||e.message}`); }
            }
          }
          (async()=>{await one('watishetweer.nl');await one('www.watishetweer.nl');})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Cloudflare zone en voorbereide records
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=watishetweer.nl' -o /tmp/zones.json
          jq -e '.success == true' /tmp/zones.json >/dev/null
          zone_id="$(jq -r '.result[0].id // ""' /tmp/zones.json)"
          test -n "$zone_id"
          jq -r '.result[0] | {id,name,status,name_servers,original_name_servers} | @json' /tmp/zones.json
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100" -o /tmp/records.json
          jq -e '.success == true' /tmp/records.json >/dev/null
          echo '=== Cloudflare DNS records ==='
          jq -r '.result[] | {type,name,content,priority,proxied,ttl} | @json' /tmp/records.json

      - name: Actuele cutoververificatie
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=watishetweer.nl' -o /tmp/zones-now.json
          zone_status="$(jq -r '.result[0].status // "missing"' /tmp/zones-now.json)"
          echo "ZONE_STATUS=$zone_status"

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT/domains"
          curl -fsS "${auth[@]}" "$API" -o /tmp/domains-now.json
          jq -r '.result[] | "DOMAIN_STATUS \(.name)=\(.status) verification=\(.verification_data.status // "n/a") validation=\(.validation_data.status // "n/a")"' /tmp/domains-now.json

          echo '=== Autoritatieve nameservers volgens publieke DNS ==='
          node <<'NODE'
          const dns=require('node:dns').promises;
          dns.resolveNs('watishetweer.nl').then(x=>console.log(x.sort().join('\n'))).catch(e=>console.log(`NS_ERROR=${e.code||e.message}`));
          NODE

          if [ "$zone_status" = "active" ]; then
            echo '=== HTTPS smoke ==='
            for url in \
              'https://watishetweer.nl/' \
              'https://www.watishetweer.nl/' \
              'https://watishetweer.nl/api/plaatsnaam?lat=52.37&lon=4.90' \
              'https://watishetweer.nl/api/waarschuwingen?lat=52.37&lon=4.90' \
              'https://watishetweer.nl/api/neerslag?lat=52.37&lon=4.90'; do
              code="$(curl -L -sS --max-time 30 -o /tmp/body -w '%{http_code}' "$url" || true)"
              echo "$code $url"
            done
            echo '=== Cloudflare headers apex ==='
            curl -I -sS --max-time 30 https://watishetweer.nl/ | grep -Ei '^(HTTP/|server:|cf-ray:|cf-cache-status:|weather-build-sha:)' || true
          fi
