# TIJDELIJK (niet mergen): alleen-lezen meting van responstijden vanaf een GitHub-runner.
# Doet uitsluitend GET-verzoeken naar publieke URL's van de eigen site; geen secrets, geen schrijfrechten.
name: Latentieonderzoek (tijdelijk)

on:
  push:
    branches: [claude/latentie-meting-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meet:
    name: meet-vanaf-runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Vantagepunt van de runner
        run: |
          echo "runner-edge (watishetweer.nl/cdn-cgi/trace):"; curl -sS -m 20 https://watishetweer.nl/cdn-cgi/trace | grep -E "^(colo|loc|ip|http)=" || true
          echo "runner-edge (1.1.1.1/cdn-cgi/trace):"; curl -sS -m 20 https://1.1.1.1/cdn-cgi/trace | grep -E "^(colo|loc|ip)=" || true
      - name: Meet (30 rondes, 9 doelen)
        run: bash scripts/tijdelijk/meet.sh meting.csv 30 2 github-runner
      - name: Meet preview (Access) en productie
        env:
          PREVIEW_ROOT: https://54e7df73.watishetweer.pages.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/tijdelijk/meet-preview.sh preview.csv 20 2 github-runner
      - name: Bereikbaarheid weerbron per locatie (Open-Meteo en eigen reserveroute)
        run: bash scripts/tijdelijk/meet-bron.sh | tee bron.csv
      - name: Toon resultaat
        if: always()
        run: |
          echo "=== meting.csv ==="; cat meting.csv
          echo "=== preview.csv ==="; cat preview.csv
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: latentie-meting-${{ github.run_attempt }}
          path: |
            meting.csv
            preview.csv
            bron.csv
          retention-days: 7
