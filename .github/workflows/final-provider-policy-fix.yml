name: Final provider policy fix

on:
  push:
    branches:
      - agent/final-audit-provider-policy
    paths:
      - scripts/apply-final-provider-policy.js
      - scripts/apply-final-warning-feed.js
      - scripts/apply-final-test-contracts.js
      - scripts/apply-final-broad-contracts.js
      - .github/workflows/final-provider-policy-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pas toe, test volledig en leg resultaat vast
        shell: bash
        run: |
          set +e
          RESULT=scripts/final-audit-result.txt
          : > "$RESULT"
          runcheck() {
            echo "===== $1 =====" >> "$RESULT"
            shift
            "$@" >> "$RESULT" 2>&1
            code=$?
            echo "EXIT=$code" >> "$RESULT"
            return $code
          }

          status=0
          runcheck "provider-migratie" node scripts/apply-final-provider-policy.js || status=$?
          if [ "$status" -eq 0 ]; then runcheck "MeteoAlarm-feed" node scripts/apply-final-warning-feed.js || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "testcontracten" node scripts/apply-final-test-contracts.js || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "brede-contracten" node scripts/apply-final-broad-contracts.js || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "npm-test" npm test || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "npm-build" npm run build || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "playwright-install" npm install --no-save --package-lock=false playwright@latest || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "browser-install" npx playwright install --with-deps chromium webkit || status=$?; fi
          if [ "$status" -eq 0 ]; then runcheck "browser-tests" node browser-playwright.test.js || status=$?; fi
          echo "FINAL_STATUS=$status" >> "$RESULT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RESULT"
          if [ "$status" -eq 0 ]; then
            git add -- index.html lib/plaatsnaam.cjs lib/waarschuwingen.cjs privacy.html prelaunch-regressions.test.js audit-regressions.test.js run.js
            git commit -m "Herstel providers en waarschuwingenfeeds"
          else
            git commit -m "Leg mislukte providercontrole vast"
          fi
          git push origin HEAD:agent/final-audit-provider-policy
