name: Cloudflare human analytics report

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Komma-gescheiden rapportvensters in dagen (1-30)'
        required: false
        default: '1,7,30'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-human-analytics-report.yml'
      - 'scripts/cloudflare-human-analytics-report.js'
      - 'scripts/cloudflare-human-analytics-report.test.js'
      - 'scripts/cloudflare-admin-analytics-runtime.js'
      - 'scripts/cloudflare-admin-analytics-runtime.test.js'
      - 'scripts/cloudflare-admin-dashboard.test.js'
      - 'functions/api/admin/seo/cloudflare.js'
      - 'admin/seo/index.html'
      - 'admin/seo/cloudflare-dashboard.js'
      - 'admin/seo/cloudflare-dashboard.css'

permissions:
  contents: read

concurrency:
  group: watishetweer-cloudflare-human-analytics
  cancel-in-progress: true

# SEC-02b: geen secrets op workflowniveau; ze komen uit de beschermde omgeving `productie` (alleen branch main).
# Handmatig starten kan daardoor alleen nog op main.
env:
  CLOUDFLARE_PROJECT: watishetweer
  CLOUDFLARE_ANALYTICS_WINDOWS: ${{ github.event.inputs.windows || '1,7,30' }}

jobs:
  report:
    runs-on: ubuntu-latest
    # Rapport en runtime-sync, geen deployment: wel de omgeving (secrets en branchbeperking), geen deploymentregel.
    environment:
      name: productie
      deployment: false
    env:
      CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTIE_ANALYTICS_API_TOKEN }}
      CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTIE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTIE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PRODUCTIE_ACCOUNT_ID }}
    steps:
      - name: Checkout exacte bron-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test bot-gefilterd rapportcontract
        run: node scripts/cloudflare-human-analytics-report.test.js

      - name: Test admin-dashboardcontract
        run: node scripts/cloudflare-admin-dashboard.test.js

      - name: Test veilige production-runtime-sync
        run: node scripts/cloudflare-admin-analytics-runtime.test.js

      - name: Haal Cloudflare RUM op met botfilter
        run: node scripts/cloudflare-human-analytics-report.js

      - name: Sync read-only analytics naar Pages production runtime
        if: github.ref == 'refs/heads/main'
        run: node scripts/cloudflare-admin-analytics-runtime.js
