name: Tijdelijke API rate-limit activatie

on:
  push:
    branches:
      - audit/activate-api-rate-limit-20260831

permissions:
  contents: read

jobs:
  activate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: watishetweer
      EXPECTED_SHA: 6d8b27600c91dc52741db4d1e735400a94c97bd8
    steps:
      - name: Checkout exact goedgekeurde main-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Controleer productie en credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          html="$(curl -fsSL --retry 2 --retry-delay 1 --max-time 30 https://watishetweer.nl/)"
          printf '%s' "$html" | grep -F "$EXPECTED_SHA" >/dev/null
          echo "PRODUCTIE_SHA_OK $EXPECTED_SHA"

      - name: Activeer Cloudflare API rate limit idempotent
        run: node scripts/cloudflare-api-rate-limit.js

      - name: Lees rate limit terug en bewijs exacte configuratie
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { controleerApiRateLimit } = require('./scripts/cloudflare-api-rate-limit.js');
          (async () => {
            const status = await controleerApiRateLimit({
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              token: process.env.CLOUDFLARE_API_TOKEN,
              project: process.env.CLOUDFLARE_PROJECT
            });
            console.log('RATE_LIMIT_STATUS ' + JSON.stringify(status));
            if (!status.actief) throw new Error('Rate limit is na activatie niet actief: ' + String(status.reden || 'onbekend'));
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Bewijs 429 en herstel zonder homepage te raken
        shell: bash
        run: |
          set -euo pipefail
          url='https://watishetweer.nl/api/neerslag?lat=35.68043&lon=139.76611&land=JP'
          : > /tmp/codes.txt
          seq 1 72 | xargs -I{} -P24 sh -c 'curl -sS --max-time 20 -o /dev/null -w "%{http_code}\n" "$1" || true' _ "$url" >> /tmp/codes.txt
          sort /tmp/codes.txt | uniq -c | sort -n
          count429="$(grep -c '^429$' /tmp/codes.txt || true)"
          test "$count429" -ge 1
          home_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://watishetweer.nl/)"
          test "$home_code" = '200'
          echo "RATE_LIMIT_TRIGGERED 429_count=$count429 homepage=$home_code"
          sleep 12
          recovery_code="$(curl -sS --retry 2 --retry-delay 1 --max-time 30 -o /dev/null -w '%{http_code}' "$url")"
          test "$recovery_code" = '200'
          echo "RATE_LIMIT_RECOVERED api=$recovery_code"
