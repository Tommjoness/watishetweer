name: Tijdelijke WeatherNow-eindcontrole

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-final-weather-audit.yml]

permissions:
  contents: write

jobs:
  audit-preview-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extrema-radar-status
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Corrigeer tests en pas eindcorrecties toe
        shell: bash
        run: |
          set -euo pipefail
          python .github/fix-audit-tests.py
          python .github/final-audit.py

      - name: Controleer syntax, JSON en volledige testset
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './.github/*' -print0)
          python - <<'PY'
          from pathlib import Path
          import json, re
          html=Path('index.html').read_text()
          scripts='\n'.join(re.findall(r'<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)</script>',html))
          Path('/tmp/index-inline.js').write_text(scripts)
          for f in ['package.json','manifest.json','lettermaten.json']:
              json.loads(Path(f).read_text())
          PY
          node --check /tmp/index-inline.js
          node run.js | tee /tmp/weathernow-tests.log
          ! grep -q 'FOUT' /tmp/weathernow-tests.log

      - name: Publiceer gecontroleerde previewbranch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/final-audit.py .github/workflows/final-code-audit.yml audit-failure.txt
          git config user.name "WeatherNow Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rond WeatherNow af na volledige codecontrole"
          git push origin HEAD:agent/extrema-radar-status

      - name: Bewaar diagnose bij mislukking
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo 'WeatherNow eindcontrole mislukt'
            echo
            test -f /tmp/weathernow-tests.log && cat /tmp/weathernow-tests.log
          } > audit-failure.txt
          git config user.name "WeatherNow Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-failure.txt
          git commit -m "Leg fout uit WeatherNow-eindcontrole vast"
          git push origin HEAD:agent/extrema-radar-status

      - name: Ruim tijdelijke workflow op main op
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git rm .github/workflows/run-final-weather-audit.yml
          git commit -m "[skip ci] Verwijder tijdelijke WeatherNow-eindcontrole"
          git push origin main
