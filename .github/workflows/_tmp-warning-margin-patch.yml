name: Temporary warning margin patch

on:
  push:
    branches:
      - hardening/warning-atom-margin-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/warning-atom-margin-20260830
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pas minimale timeoutmarge toe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('lib/waarschuwingen.cjs')
          text = runtime.read_text()
          old = 'const METEO_ATOM_TIMEOUT_MS = 3200;'
          new = 'const METEO_ATOM_TIMEOUT_MS = 4500;'
          if text.count(old) != 1:
              raise SystemExit(f'Verwacht exact 1 oude Atom-timeout, gevonden {text.count(old)}')
          runtime.write_text(text.replace(old, new))

          test = Path('scripts/warning-upstream-hedge.test.js')
          t = test.read_text()
          needle = '  assert.ok(bron.includes("METEO_HEDGE_HEADER_MS = 1500"));\n'
          insert = (
              '  assert.ok(bron.includes("METEO_HEDGE_HEADER_MS = 1500"));\n'
              '  const atomTimeout=Number((bron.match(/METEO_ATOM_TIMEOUT_MS = (\\d+)/)||[])[1]);\n'
              '  const hedgeTimeout=Number((bron.match(/METEO_HEDGE_HEADER_MS = (\\d+)/)||[])[1]);\n'
              '  assert.equal(atomTimeout,4500,"Atom krijgt extra marge voor tijdelijke netwerkvariatie");\n'
              '  assert.ok(hedgeTimeout+atomTimeout<=6000,"hedged fallback blijft minstens 1 seconde onder het 7s clientbudget");\n'
          )
          if t.count(needle) != 1:
              raise SystemExit(f'Verwacht exact 1 hedge-testanker, gevonden {t.count(needle)}')
          test.write_text(t.replace(needle, insert))
          PY
          node scripts/warning-upstream-hedge.test.js
          git diff --check
          git diff -- lib/waarschuwingen.cjs scripts/warning-upstream-hedge.test.js
      - name: Commit echte wijziging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/waarschuwingen.cjs scripts/warning-upstream-hedge.test.js
          git commit -m 'Geef MeteoAlarm Atom-fallback veilige timeoutmarge'
          git push origin HEAD:hardening/warning-atom-margin-20260830
