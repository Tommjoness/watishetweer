name: Recover WeatherNow v71

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-weathernow-v71.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/extrema-radar-status
          fetch-depth: 0

      - name: Reconstruct exact patch
        shell: bash
        run: |
          cat .recovery/patch-*.b64 | tr -d '\n' | base64 -d > /tmp/weathernow.patch.xz
          echo "0f3b6ecdd57bb757558c9f6e67b0712ab0972325d91952bf692a5d819447497d  /tmp/weathernow.patch.xz" | sha256sum -c -
          xz -dc /tmp/weathernow.patch.xz > /tmp/weathernow.patch
          git apply --check /tmp/weathernow.patch
          git apply /tmp/weathernow.patch

      - name: Verify exact files and full test suite
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "8060c8b40e9e41c8e929e9a35fde75f3d7147d0d"
          test "$(git hash-object run.js)" = "c27812f048d5a2bc983f0380807f4ae204ddf3c7"
          test "$(git hash-object kern.js)" = "a82d346daea53765412c7d06910977e0c60e3aea"
          node --check run.js
          node --check kern.js
          node --check sw.js
          node run.js | tee /tmp/test-output.txt
          grep -Fx "689 geslaagd, 0 mislukt" /tmp/test-output.txt
          git diff --check

      - name: Commit only the verified WeatherNow files
        shell: bash
        run: |
          rm -rf .recovery
          rm -f .github/workflows/apply-extrema-radar-fix.yml
          git config user.name "WeatherNow Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Herstel gecontroleerde WeatherNow v71"
          git push origin HEAD:agent/extrema-radar-status
