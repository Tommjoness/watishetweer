name: Temporary KNMI capabilities cache patch

on:
  push:
    branches:
      - hardening/knmi-capabilities-cache-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/knmi-capabilities-cache-20260830
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pas providergebonden metadata-cache toe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime=Path('lib/knmi-neerslag.cjs')
          s=runtime.read_text()

          old='const NOWCAST_PUNTEN = 25;\n'
          new='const NOWCAST_PUNTEN = 25;\nconst NOWCAST_METADATA_CACHE_MAX_MS = 10 * 1000;\nlet nowcastMetadataCaches = new WeakMap();\n'
          if s.count(old)!=1:
              raise SystemExit(f'Verwacht exact één NOWCAST_PUNTEN-anker, gevonden {s.count(old)}')
          s=s.replace(old,new)

          anchor='''async function haalActueelPunt(lat, lon, fetchImpl = fetch, nuMs = Date.now()) {\n'''
          helper='''function metadataMaxAgeMs(headers) {\n  const waarde = String(headers && typeof headers.get === "function" ? headers.get("cache-control") || "" : "");\n  const match = /(?:^|,)\\s*max-age=(\\d+)/i.exec(waarde);\n  const seconden = match ? Number(match[1]) : 0;\n  if (!Number.isFinite(seconden) || seconden <= 0) return 0;\n  return Math.min(seconden * 1000, NOWCAST_METADATA_CACHE_MAX_MS);\n}\n\nfunction metadataCacheVoor(fetchImpl) {\n  let cache = nowcastMetadataCaches.get(fetchImpl);\n  if (!cache) {\n    cache = { waarde: null, vervaltOp: 0, belofte: null };\n    nowcastMetadataCaches.set(fetchImpl, cache);\n  }\n  return cache;\n}\n\nasync function laadNowcastMetadata(fetchImpl) {\n  const r = await fetchImpl(capabilitiesUrl(NOWCAST_DATASET), {\n    headers: { "Accept": "text/xml", "User-Agent": "watishetweer.nl/1.0" },\n    signal: AbortSignal.timeout(6500)\n  });\n  const xml = await r.text();\n  if (!r.ok) throw new Error("KNMI WMS status " + r.status);\n  if (!xml.includes("<Name>" + NOWCAST_LAAG + "</Name>")) throw new Error("KNMI nowcastlaag ontbreekt");\n  const referenceTime = referenceTimeUitCapabilities(xml);\n  if (!referenceTime) throw new Error("KNMI nowcast reference_time ontbreekt");\n  return { waarde: { referenceTime }, ttlMs: metadataMaxAgeMs(r.headers) };\n}\n\nasync function haalNowcastMetadata(fetchImpl = fetch, nuMs = Date.now(), cacheNuMs = Date.now()) {\n  const cache = metadataCacheVoor(fetchImpl);\n  if (cache.waarde && cache.vervaltOp > cacheNuMs) {\n    if (!isVers(cache.waarde.referenceTime, nuMs)) throw new Error("KNMI nowcast is verouderd");\n    return cache.waarde;\n  }\n\n  if (!cache.belofte) {\n    const gestartOp = cacheNuMs;\n    const belofte = (async () => {\n      const geladen = await laadNowcastMetadata(fetchImpl);\n      if (geladen.ttlMs > 0) {\n        cache.waarde = geladen.waarde;\n        cache.vervaltOp = gestartOp + geladen.ttlMs;\n      } else {\n        cache.waarde = null;\n        cache.vervaltOp = 0;\n      }\n      return geladen.waarde;\n    })();\n    cache.belofte = belofte;\n    belofte.finally(() => {\n      if (cache.belofte === belofte) cache.belofte = null;\n    }).catch(() => {});\n  }\n\n  const waarde = await cache.belofte;\n  if (!isVers(waarde.referenceTime, nuMs)) throw new Error("KNMI nowcast is verouderd");\n  return waarde;\n}\n\n'''
          if s.count(anchor)!=1:
              raise SystemExit(f'Verwacht exact één haalActueelPunt-anker, gevonden {s.count(anchor)}')
          s=s.replace(anchor,helper+anchor)

          old_now='''async function haalNowcastPunt(lat, lon, fetchImpl = fetch, nuMs = Date.now()) {\n  const xml = await fetchTekst(capabilitiesUrl(NOWCAST_DATASET), fetchImpl, 6500, "text/xml");\n  if (!xml.includes("<Name>" + NOWCAST_LAAG + "</Name>")) throw new Error("KNMI nowcastlaag ontbreekt");\n  const referenceTime = referenceTimeUitCapabilities(xml);\n  if (!referenceTime) throw new Error("KNMI nowcast reference_time ontbreekt");\n  if (!isVers(referenceTime, nuMs)) throw new Error("KNMI nowcast is verouderd");\n\n'''
          new_now='''async function haalNowcastPunt(lat, lon, fetchImpl = fetch, nuMs = Date.now()) {\n  const { referenceTime } = await haalNowcastMetadata(fetchImpl, nuMs);\n\n'''
          if s.count(old_now)!=1:
              raise SystemExit(f'Verwacht exact één oude capabilities-route, gevonden {s.count(old_now)}')
          s=s.replace(old_now,new_now)

          export_anchor='''  NOWCAST_PUNTEN,\n'''
          export_new='''  NOWCAST_PUNTEN,\n  NOWCAST_METADATA_CACHE_MAX_MS,\n'''
          if s.count(export_anchor)!=1:
              raise SystemExit(f'Verwacht exact één exportanker voor NOWCAST_PUNTEN, gevonden {s.count(export_anchor)}')
          s=s.replace(export_anchor,export_new)

          end_anchor='''  normaliseerNowcastAntwoord,\n  haalActueelPunt,\n'''
          end_new='''  normaliseerNowcastAntwoord,\n  metadataMaxAgeMs,\n  haalNowcastMetadata,\n  haalActueelPunt,\n'''
          if s.count(end_anchor)!=1:
              raise SystemExit(f'Verwacht exact één helper-exportanker, gevonden {s.count(end_anchor)}')
          s=s.replace(end_anchor,end_new)
          runtime.write_text(s)

          test=Path('scripts/knmi-neerslag.test.js')
          t=test.read_text()
          import_old='''  normaliseerNowcastAntwoord,\n  haalActueelPunt,\n'''
          import_new='''  normaliseerNowcastAntwoord,\n  NOWCAST_METADATA_CACHE_MAX_MS,\n  metadataMaxAgeMs,\n  haalNowcastMetadata,\n  haalActueelPunt,\n'''
          if t.count(import_old)!=1:
              raise SystemExit(f'Verwacht exact één test-importanker, gevonden {t.count(import_old)}')
          t=t.replace(import_old,import_new)

          insert_anchor='''test("haalActueelPunt accepteert een verse echte-vorm WMS-respons", async () => {\n'''
          tests='''test("KNMI metadata-cache volgt provider max-age met harde bovengrens", () => {\n  assert.equal(NOWCAST_METADATA_CACHE_MAX_MS, 10000);\n  assert.equal(metadataMaxAgeMs({get:()=>"public, max-age=10"}), 10000);\n  assert.equal(metadataMaxAgeMs({get:()=>"max-age=30"}), 10000);\n  assert.equal(metadataMaxAgeMs({get:()=>"no-cache"}), 0);\n});\n\ntest("KNMI capabilities worden binnen provider-TTL hergebruikt en daarna vernieuwd", async () => {\n  let calls=0;\n  const fakeFetch=async()=>{calls++;return {\n    ok:true,status:200,headers:{get:n=>String(n).toLowerCase()==="cache-control"?"max-age=10":null},\n    text:async()=>'<WMS_Capabilities><Layer><Name>precipitation_nowcast</Name><Dimension name="reference_time" default="2026-08-15T10:35:00Z">x</Dimension></Layer></WMS_Capabilities>'\n  };};\n  await haalNowcastMetadata(fakeFetch,NU,1000);\n  await haalNowcastMetadata(fakeFetch,NU,10999);\n  assert.equal(calls,1);\n  await haalNowcastMetadata(fakeFetch,NU,11000);\n  assert.equal(calls,2);\n});\n\ntest("gelijktijdige KNMI capabilities-requests delen één in-flight request", async () => {\n  let calls=0;\n  const fakeFetch=async()=>{\n    calls++;\n    await new Promise(resolve=>setTimeout(resolve,10));\n    return {ok:true,status:200,headers:{get:()=>"max-age=10"},text:async()=>'<WMS_Capabilities><Layer><Name>precipitation_nowcast</Name><Dimension name="reference_time" default="2026-08-15T10:35:00Z">x</Dimension></Layer></WMS_Capabilities>'};\n  };\n  const waarden=await Promise.all([\n    haalNowcastMetadata(fakeFetch,NU,2000),\n    haalNowcastMetadata(fakeFetch,NU,2000),\n    haalNowcastMetadata(fakeFetch,NU,2000)\n  ]);\n  assert.equal(calls,1);\n  assert(waarden.every(x=>x.referenceTime==="2026-08-15T10:35:00Z"));\n});\n\ntest("mislukte of niet-cachebare capabilities worden niet als metadata-cachehit bewaard", async () => {\n  let calls=0;\n  const fakeFetch=async()=>{\n    calls++;\n    if(calls===1)return {ok:false,status:503,headers:{get:()=>"max-age=10"},text:async()=>"tijdelijk stuk"};\n    return {ok:true,status:200,headers:{get:()=>null},text:async()=>'<WMS_Capabilities><Layer><Name>precipitation_nowcast</Name><Dimension name="reference_time" default="2026-08-15T10:35:00Z">x</Dimension></Layer></WMS_Capabilities>'};\n  };\n  await assert.rejects(()=>haalNowcastMetadata(fakeFetch,NU,3000),/status 503/);\n  await haalNowcastMetadata(fakeFetch,NU,3001);\n  await haalNowcastMetadata(fakeFetch,NU,3002);\n  assert.equal(calls,3);\n});\n\n'''
          if t.count(insert_anchor)!=1:
              raise SystemExit(f'Verwacht exact één test-insertanker, gevonden {t.count(insert_anchor)}')
          t=t.replace(insert_anchor,tests+insert_anchor)
          test.write_text(t)
          PY
          node scripts/knmi-neerslag.test.js
          node scripts/knmi-freshness-hardening.test.js
          node scripts/knmi-nowcast-route-disabled.test.js
          git diff --check
          git diff -- lib/knmi-neerslag.cjs scripts/knmi-neerslag.test.js
      - name: Commit KNMI metadata-cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/knmi-neerslag.cjs scripts/knmi-neerslag.test.js
          git commit -m 'Deel KNMI nowcastmetadata binnen provider-TTL'
          git push origin HEAD:hardening/knmi-capabilities-cache-20260830
