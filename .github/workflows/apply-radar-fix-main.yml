name: Voer WeatherNow-radarfix gecontroleerd uit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-radar-fix-main.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extrema-radar-status
          fetch-depth: 0

      - name: Pas radarpatch toe
        run: |
          cat .radar-fix/chunk-*.b64 | base64 -d > /tmp/radar-fix.patch
          git apply --check /tmp/radar-fix.patch
          git apply /tmp/radar-fix.patch

      - name: Controleer syntax
        run: |
          node --check run.js
          node --check kern.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          js = '\n'.join(re.findall(r'<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)</script>', html))
          Path('/tmp/index-inline.js').write_text(js)
          PY
          node --check /tmp/index-inline.js

      - name: Draai volledige testset
        run: node run.js

      - name: Leg fix vast en ruim tijdelijke branchbestanden op
        run: |
          rm -rf .radar-fix
          rm -f .github/workflows/apply-radar-fix.yml
          git config user.name "WeatherNow Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Herstel vooruitlopende radaranimatie"
          git push origin HEAD:agent/extrema-radar-status
