name: Temporary SEO preview config diagnostic

on:
  push:
    branches:
      - fix/seo-preview-access-aud-20260917

permissions:
  contents: read

jobs:
  diagnose-preview-config:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: watishetweer
      TARGET_EMAIL: maitri.polwatteg@gmail.com
    steps:
      - name: Repair once, then inspect preview config without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          if [ "${GITHUB_RUN_ATTEMPT:-1}" = "1" ]; then
            jq -n --arg email "$TARGET_EMAIL" '{deployment_configs:{preview:{env_vars:{SEO_ADMIN_EMAILS:{type:"secret_text",value:$email}}}}}' > /tmp/patch.json
            curl -fsS -X PATCH -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/patch.json "$API" -o /tmp/patch-response.json
            jq -e '.success == true' /tmp/patch-response.json >/dev/null
            echo 'Attempt 1: preview allowlist als secret_text gezet.'
          else
            echo 'Rerun: alleen inspectie; config wordt niet gewijzigd.'
          fi

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' "$API" -o /tmp/project.json
          jq -e '.success == true' /tmp/project.json >/dev/null
          test "$(jq -r '.result.production_branch // ""' /tmp/project.json)" = main

          jq -n \
            --arg teamDomainType "$(jq -r '.result.deployment_configs.preview.env_vars.CF_ACCESS_TEAM_DOMAIN.type // "missing"' /tmp/project.json)" \
            --arg audType "$(jq -r '.result.deployment_configs.preview.env_vars.CF_ACCESS_AUD.type // "missing"' /tmp/project.json)" \
            --arg allowlistType "$(jq -r '(.result.deployment_configs.preview.env_vars.SEO_ADMIN_EMAILS.type // .result.deployment_configs.preview.env_vars.SEO_ADMIN_EMAIL.type // "missing")' /tmp/project.json)" \
            --arg productionTeamDomainType "$(jq -r '.result.deployment_configs.production.env_vars.CF_ACCESS_TEAM_DOMAIN.type // "missing"' /tmp/project.json)" \
            --arg productionAllowlistType "$(jq -r '(.result.deployment_configs.production.env_vars.SEO_ADMIN_EMAILS.type // .result.deployment_configs.production.env_vars.SEO_ADMIN_EMAIL.type // "missing")' /tmp/project.json)" \
            '{runAttempt:env.GITHUB_RUN_ATTEMPT,teamDomainType:$teamDomainType,audType:$audType,allowlistType:$allowlistType,productionTeamDomainType:$productionTeamDomainType,productionAllowlistType:$productionAllowlistType}'

          test "$(jq -r '.result.deployment_configs.preview.env_vars.CF_ACCESS_TEAM_DOMAIN.type // "missing"' /tmp/project.json)" = secret_text
          test "$(jq -r '.result.deployment_configs.preview.env_vars.CF_ACCESS_AUD.type // "missing"' /tmp/project.json)" = secret_text
          test "$(jq -r '(.result.deployment_configs.preview.env_vars.SEO_ADMIN_EMAILS.type // .result.deployment_configs.preview.env_vars.SEO_ADMIN_EMAIL.type // "missing")' /tmp/project.json)" = secret_text
