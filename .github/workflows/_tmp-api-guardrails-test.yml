name: Temporary API guardrails test

on:
  push:
    branches:
      - hardening/api-observability-rate-limit-ready-20260830

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Gerichte backend-guardrails
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/cloudflare-edge-cache.mjs
          node --check scripts/cloudflare-api-rate-limit.js
          node scripts/cloudflare-edge-cache.test.mjs
          node scripts/cloudflare-api-observability.test.mjs
          node scripts/cloudflare-api-rate-limit.test.js
          git diff --check HEAD~5..HEAD
