name: Live warning hedge probe

on:
  push:
    branches:
      - hardening/live-warning-probe-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vergelijk Duitse upstreams en immutable API
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          compat='https://feeds.meteoalarm.org/api/v1/warnings/feeds-germany'
          atom='https://feeds.meteoalarm.org/feeds/meteoalarm-legacy-atom-germany'
          app='https://f4d9d9ef.watishetweer.pages.dev/api/waarschuwingen?lat=52.52&lon=13.405&land=DE'

          measure() {
            name="$1"; url="$2"; max="$3"
            echo "--- $name ---"
            rm -f "/tmp/${name}.headers" "/tmp/${name}.body"
            curl -sS --max-time "$max" \
              -D "/tmp/${name}.headers" -o "/tmp/${name}.body" \
              -w 'status=%{http_code} total=%{time_total}s start=%{time_starttransfer}s bytes=%{size_download}\n' \
              "$url"
            rc=$?
            echo "curl_rc=$rc"
            grep -Ei '^(content-length|content-type|cache-control|etag|last-modified):' "/tmp/${name}.headers" || true
            if [ -f "/tmp/${name}.body" ]; then wc -c "/tmp/${name}.body"; fi
          }

          measure compat "$compat" 12
          measure atom "$atom" 12

          for attempt in 1 2; do
            echo "--- app attempt $attempt ---"
            rm -f /tmp/app.headers /tmp/app.body
            curl -sS --max-time 9 -H 'Cache-Control: no-cache' \
              -D /tmp/app.headers -o /tmp/app.body \
              -w 'status=%{http_code} total=%{time_total}s start=%{time_starttransfer}s bytes=%{size_download}\n' \
              "$app"
            echo "curl_rc=$?"
            grep -Ei '^(x-wiw-edge-cache|cf-cache-status|age|content-type|cache-control|cloudflare-cdn-cache-control):' /tmp/app.headers || true
            jq '{bron,dekking,plaatsSpecifiek,reden,aantal:(.lijst|length)}' /tmp/app.body || cat /tmp/app.body
          done

          exit 0
