name: WeatherNow production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weathernow-production-smoke
  cancel-in-progress: false

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Controleer exacte productie, routes, redirects en API-contracten
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_POLL_MS: 10000
          SMOKE_ATTEMPTS: 36
          SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: node scripts/production-smoke.js
      - name: Controleer exact live sitemapcontract
        run: node scripts/production-sitemap-contract.js

  wereldwijd-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Controleer wereldwijd op mobiel en desktop
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/run-production-worldwide-browser.js

  staff-audit-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Controleer staff-audit interacties op productie
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-staff-audit-browser.js
      - name: Controleer compacte weekverwachting op productie
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-week-forecast-compact-browser.js

  live-performance-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Chromium- en WebKit-monitor
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Meet live laadtijd, verzoekketen en grafiekinteractie
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-live-performance-browser.js

  mobile-cls-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Meet vijf koude mobiele CLS-runs op exacte productie-SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-mobile-cls-browser.js

  final-release-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Verzamel finale live releasebewijzen
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-final-release-browser.js
      - name: Bewaar screenshots en bewijsrapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-evidence-${{ github.sha }}
          path: artifacts/final-release
          if-no-files-found: warn
          retention-days: 30
