name: WeatherNow production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weathernow-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Controleer exacte productie, routes, redirects en API-contracten
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_POLL_MS: 10000
          SMOKE_ATTEMPTS: 36
          SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: node scripts/production-smoke.js
