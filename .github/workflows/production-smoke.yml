name: WeatherNow production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weathernow-production-smoke
  cancel-in-progress: false

jobs:
  production-contract:
    runs-on: ubuntu-latest
    # De productiebuild met ~170 plaatspagina's duurt ~9 min; de SHA-wacht
    # hieronder mag tot 15 min duren, plus de contractcontroles zelf.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Controleer exacte productie, routes, redirects en API-contracten
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_POLL_MS: 10000
          SMOKE_ATTEMPTS: 90
          SMOKE_REQUEST_TIMEOUT_MS: 10000
        run: node scripts/production-smoke.js
      - name: Controleer exact live sitemapcontract
        run: node scripts/production-sitemap-contract.js
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js

  wereldwijd-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm ci --ignore-scripts
      - name: Controleer wereldwijd op mobiel en desktop
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/run-production-worldwide-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/netwerkdiagnostiek.js https://watishetweer.nl
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js

  staff-audit-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm ci --ignore-scripts
      - name: Controleer staff-audit interacties op productie
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-staff-audit-browser.js
      - name: Controleer compacte weekverwachting op productie
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-week-forecast-compact-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/netwerkdiagnostiek.js https://watishetweer.nl
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js

  live-performance-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Installeer Chromium- en WebKit-monitor
        run: npm ci --ignore-scripts
      - name: Meet live laadtijd, verzoekketen en grafiekinteractie
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-live-performance-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/netwerkdiagnostiek.js https://watishetweer.nl
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js

  mobile-cls-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Installeer Chromium-monitor
        run: npm ci --ignore-scripts
      - name: Meet vijf koude mobiele CLS-runs op exacte productie-SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-mobile-cls-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/netwerkdiagnostiek.js https://watishetweer.nl
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js

  final-release-browser:
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Installeer Chromium- en WebKit-monitor
        run: npm ci --ignore-scripts
      - name: Verzamel finale live releasebewijzen
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-final-release-browser.js
      - name: Verifieer 10 gepacete cold loads, Dubai en history op productie
        if: github.event_name != 'schedule'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          COLD_LOAD_RUNS_PER_PROFILE: 5
          COLD_LOAD_OBSERVATION_MS: 12000
          COLD_LOAD_PACING_MS: 15000
          COLD_LOAD_ATTEMPTS: 3
          COLD_LOAD_PROFILE_COOLDOWN_MS: 45000
        run: node scripts/run-production-pre-sale-acceptance-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        # Alleen de eigen site: Open-Meteo wordt niet vanuit CI gemeten (Open-Meteo, ticket #235915);
        # echte beschikbaarheid: docs/open-meteo-monitoring.md.
        run: node scripts/netwerkdiagnostiek.js https://watishetweer.nl
      - name: Bewaar screenshots en bewijsrapport
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: final-release-evidence-${{ github.sha }}
          path: artifacts/final-release
          if-no-files-found: warn
          retention-days: 30
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js

  cwv-layout-browser:
    if: github.event_name != 'schedule'
    needs: production-contract
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Installeer Chromium-monitor
        run: npm ci --ignore-scripts
      - name: Verifieer route-CLS, desktoplayout en lokale uurwissels op productie
        env:
          CWV_ROOT: https://watishetweer.nl
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/cwv-desktop-recovery-browser.js
      - name: Netwerkdiagnostiek bij mislukking
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/netwerkdiagnostiek.js https://watishetweer.nl
      - name: Bewaar productie-CWV-bewijs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-cwv-${{ github.sha }}
          path: cwv-evidence/
          retention-days: 14
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js
