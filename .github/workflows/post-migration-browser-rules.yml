name: Post-migratie browsers en rules

on:
  push:
    branches: [ops/post-migration-audit-20260826]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PRODUCTION_ROOT: https://watishetweer.nl
  EXPECTED_SHA: 49a7cc996db1d556535ea92fb34abbfc93eeb321

jobs:
  worldwide:
    name: 5 locaties mobiel en desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 49a7cc996db1d556535ea92fb34abbfc93eeb321
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Installeer Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wereldwijde productieaudit
        run: node scripts/production-worldwide-browser.js

  rules-access:
    name: Cloudflare Redirect Rules toegang
    runs-on: ubuntu-latest
    steps:
      - name: Lees Rulesets API zonder wijzigingen
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=watishetweer.nl' -o /tmp/zones.json
          zone_id="$(jq -r '.result[0].id // ""' /tmp/zones.json)"
          test -n "$zone_id"
          code="$(curl -sS -o /tmp/rulesets.json -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/rulesets")"
          echo "RULESETS_HTTP=$code"
          if [ "$code" = 200 ]; then
            jq -r '.result[] | "RULESET phase=\(.phase) kind=\(.kind) name=\(.name) id=\(.id)"' /tmp/rulesets.json
          else
            jq -r '{success,errors,messages} | @json' /tmp/rulesets.json || true
          fi
