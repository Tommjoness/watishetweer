name: Tijdelijke live API-observability audit

on:
  push:
    branches:
      - audit/live-api-observability-20260830

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT: watishetweer
      EXPECTED_SHA: 6d8b27600c91dc52741db4d1e735400a94c97bd8
      DEPLOYMENT_URL: https://73a497ac.watishetweer.pages.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6d8b27600c91dc52741db4d1e735400a94c97bd8

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bevestig exacte publieke productie-SHA
        shell: bash
        run: |
          set -euo pipefail
          for root in https://watishetweer.nl https://www.watishetweer.nl "$DEPLOYMENT_URL"; do
            html="$(curl -fsSL --max-time 30 "$root/")"
            printf '%s' "$html" | grep -F "$EXPECTED_SHA" >/dev/null
            echo "SHA OK: $root"
          done

      - name: Read-only WAF rate-limit probe
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { controleerApiRateLimit } = require('./scripts/cloudflare-api-rate-limit.js');
          (async () => {
            try {
              const resultaat = await controleerApiRateLimit({
                accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
                token: process.env.CLOUDFLARE_API_TOKEN,
                project: process.env.CLOUDFLARE_PROJECT
              });
              console.log('RATE_LIMIT_READ_OK ' + JSON.stringify(resultaat));
            } catch (error) {
              const tekst = String(error && error.message || error);
              if (/HTTP 403/.test(tekst)) {
                console.log('RATE_LIMIT_BLOCKED_403 ' + tekst);
                return;
              }
              throw error;
            }
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Tail productie en bewijs live request-ID plus events
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          : > /tmp/tail.log
          set +e
          timeout 35s npx --yes wrangler@4 pages deployment tail "$DEPLOYMENT_URL" \
            --project-name="$CLOUDFLARE_PROJECT" \
            --environment=production \
            --format=json \
            --search=wiw_api_request > /tmp/tail.log 2>&1 &
          tail_pid=$!
          set -e

          sleep 10

          suffix=$((GITHUB_RUN_ID % 90000 + 10000))
          lat="0.${suffix}"
          lon="-140.${suffix}"
          url="https://watishetweer.nl/api/neerslag?lat=${lat}&lon=${lon}&land=ZZ&live_obs=${GITHUB_RUN_ID}"

          curl -fsS --max-time 30 -D /tmp/h1 -o /tmp/b1 "$url"
          curl -fsS --max-time 30 -D /tmp/h2 -o /tmp/b2 "$url"

          id1="$(awk 'BEGIN{IGNORECASE=1} /^X-WIW-Request-ID:/ {gsub(/\r/,"",$2); print $2}' /tmp/h1 | tail -1)"
          id2="$(awk 'BEGIN{IGNORECASE=1} /^X-WIW-Request-ID:/ {gsub(/\r/,"",$2); print $2}' /tmp/h2 | tail -1)"
          cache1="$(awk 'BEGIN{IGNORECASE=1} /^X-WIW-Edge-Cache:/ {gsub(/\r/,"",$2); print $2}' /tmp/h1 | tail -1)"
          cache2="$(awk 'BEGIN{IGNORECASE=1} /^X-WIW-Edge-Cache:/ {gsub(/\r/,"",$2); print $2}' /tmp/h2 | tail -1)"

          test -n "$id1"
          test -n "$id2"
          test "$id1" != "$id2"
          test "$cache1" = "MISS" -o "$cache1" = "HIT"
          test "$cache2" = "HIT"
          cmp -s /tmp/b1 /tmp/b2

          echo "LIVE_API first=$cache1 second=$cache2 request_ids=present-and-distinct body=identical"

          tail_status=0
          wait "$tail_pid" || tail_status=$?
          if [ "$tail_status" -ne 0 ] && [ "$tail_status" -ne 124 ]; then
            cat /tmp/tail.log
            exit "$tail_status"
          fi

          cat /tmp/tail.log
          grep -F 'wiw_api_request' /tmp/tail.log >/dev/null
          grep -F 'request_id' /tmp/tail.log >/dev/null
          echo "LIVE_LOG_EVENT wiw_api_request zichtbaar in Cloudflare Pages production tail"
