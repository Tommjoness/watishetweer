name: Temporary prelaunch warning contract patch

on:
  push:
    branches:
      - hardening/warning-atom-margin-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hardening/warning-atom-margin-20260830
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Werk alleen de verouderde prelaunchverwachting bij
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('prelaunch-regressions.test.js')
          s=p.read_text()
          old='waars.includes("METEO_ATOM_TIMEOUT_MS = 3200")'
          new='waars.includes("METEO_ATOM_TIMEOUT_MS = 4500")'
          if s.count(old) != 1:
              raise SystemExit(f'Verwacht exact één oud contract, gevonden {s.count(old)}')
          p.write_text(s.replace(old,new))
          if p.read_text().count(new) != 1:
              raise SystemExit('Nieuw timeoutcontract staat niet exact één keer in prelaunch-regressies')
          PY
          node scripts/warning-upstream-hedge.test.js
          node --check prelaunch-regressions.test.js
          git diff --check
          git diff -- prelaunch-regressions.test.js
      - name: Commit contractfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add prelaunch-regressions.test.js
          git commit -m 'Werk MeteoAlarm timeoutcontract bij'
          git push origin HEAD:hardening/warning-atom-margin-20260830
