name: WeatherNow interactive preview gate PR71

on:
  pull_request:
    branches: [agent/performance-zone-cache-20260814]

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Toon Chrome-versie
        run: google-chrome --version
      - name: Installeer alleen Playwright-package
        run: npm install --no-save --package-lock=false playwright
      - name: Interactieve desktop- en mobiele previewcontrole
        env:
          PREVIEW_URL: "https://weathernow-11rtxc419-tommjoness-projects.vercel.app/?_vercel_share=B650gXw423GXEfKuRwVJVhcNwFR8gIEZ&lat=52.3500&lon=5.2600&plaats=Almere&land=NL"
        run: |
          cat > /tmp/preview-gate.js <<'NODE'
          "use strict";
          const fs=require("fs"),assert=require("assert");
          const {chromium}=require("playwright");
          const url=process.env.PREVIEW_URL;
          if(!url)throw new Error("PREVIEW_URL ontbreekt");

          async function controle(browser,naam,viewport){
            const context=await browser.newContext({viewport,serviceWorkers:"block"});
            const page=await context.newPage();
            const fouten=[];
            page.on("pageerror",e=>fouten.push("pageerror: "+String(e)));
            page.on("console",m=>{if(m.type()==="error")fouten.push("console: "+m.text());});
            try{
              const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:45000});
              assert(response,naam+": geen navigatieresponse");
              assert(response.status()<400,naam+": HTTP "+response.status());
              await page.waitForSelector("#app",{state:"visible",timeout:30000});
              await page.waitForFunction(()=>{
                const t=document.querySelector("#t"),c=document.querySelector("#cond");
                return t&&c&&t.textContent.trim()&&!/[–—]/.test(t.textContent)&&c.textContent.trim();
              },null,{timeout:30000});
              await page.waitForTimeout(1200);
              const r=await page.evaluate(()=>{
                const txt=s=>document.querySelector(s)?.textContent?.trim()||"";
                const app=document.querySelector("#app"),state=document.querySelector("#state");
                const chart=document.querySelector("#chart svg");
                return {
                  href:location.href,
                  title:document.title,
                  appVisible:!!app&&getComputedStyle(app).display!=="none",
                  stateClass:state?.className||"",
                  stateText:state?.textContent?.trim()||"",
                  temp:txt("#t"),condition:txt("#cond"),briefing:txt("#brief"),place:txt("#place"),
                  coords:txt("#coords"),days:document.querySelectorAll("#days .row.day:not(.kop)").length,
                  nights:document.querySelectorAll("#nights .row.night:not(.kop)").length,
                  chart:!!chart,footerLinks:document.querySelectorAll("footer a").length,
                  loadingBusy:app?.getAttribute("aria-busy")||null
                };
              });
              assert(r.href.includes("weathernow-11rtxc419-tommjoness-projects.vercel.app"),naam+": onverwachte eind-URL "+r.href);
              assert(r.appVisible,naam+": app niet zichtbaar");
              assert(!/err/.test(r.stateClass),naam+": foutstate: "+r.stateText);
              assert(r.temp&&r.condition,naam+": actuele weerdata ontbreekt");
              assert(r.briefing.length>=20,naam+": briefing ontbreekt/te kort");
              assert(r.chart,naam+": grafiek ontbreekt");
              assert.equal(r.days,7,naam+": verwacht 7 dagkaarten, kreeg "+r.days);
              assert(r.nights>=1,naam+": Nachtzicht ontbreekt");
              assert(r.footerLinks>=1,naam+": footerlinks ontbreken");
              assert(/Almere/i.test(r.place),naam+": locatie is niet Almere: "+r.place);
              assert(/Europe\/Amsterdam/i.test(r.coords),naam+": verwachte tijdzone niet zichtbaar: "+r.coords);
              assert.equal(r.loadingBusy,null,naam+": loading state bleef aria-busy");
              assert.deepEqual(fouten,[],naam+": browserfouten: "+fouten.join(" | "));
              await page.screenshot({path:`preview-${naam}.png`,fullPage:true});
              console.log(naam+" groen: "+JSON.stringify(r));
            }finally{await context.close();}
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,channel:"chrome"});
            try{
              await controle(browser,"desktop",{width:1440,height:900});
              await controle(browser,"mobile-390",{width:390,height:844});
              console.log("Interactieve PR71-previewgate volledig groen.");
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE
          node /tmp/preview-gate.js
      - name: Bewaar previewscreenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr71-interactive-preview-screenshots
          path: preview-*.png
          if-no-files-found: warn
          retention-days: 1
