name: Cloudflare DNSSEC voorbereiden

on:
  push:
    branches: [ops/post-migration-audit-20260826]

permissions:
  contents: read

jobs:
  dnssec:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Activeer Cloudflare DNSSEC en toon DS-gegevens
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=watishetweer.nl' -o /tmp/zones.json
          zone_id="$(jq -r '.result[0].id // ""' /tmp/zones.json)"
          test -n "$zone_id"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dnssec" -o /tmp/before.json
          jq -e '.success == true' /tmp/before.json >/dev/null
          before="$(jq -r '.result.status // "unknown"' /tmp/before.json)"
          echo "DNSSEC_BEFORE=$before"

          if [ "$before" = disabled ]; then
            code="$(curl -sS -o /tmp/enable.json -w '%{http_code}' "${auth[@]}" -X PATCH "https://api.cloudflare.com/client/v4/zones/$zone_id/dnssec" --data '{"status":"active"}')"
            echo "DNSSEC_ENABLE_HTTP=$code"
            jq -e '.success == true' /tmp/enable.json >/dev/null
          fi

          ready=false
          for attempt in $(seq 1 18); do
            curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dnssec" -o /tmp/after.json
            jq -e '.success == true' /tmp/after.json >/dev/null
            status="$(jq -r '.result.status // "unknown"' /tmp/after.json)"
            ds="$(jq -r '.result.ds // ""' /tmp/after.json)"
            echo "DNSSEC_POLL_${attempt} status=$status ds_present=$([ -n "$ds" ] && echo yes || echo no)"
            if [ -n "$ds" ]; then ready=true; break; fi
            sleep 10
          done

          jq -r '.result | "DNSSEC_STATUS=\(.status)\nKEY_TAG=\(.key_tag // "")\nALGORITHM=\(.algorithm // "")\nDIGEST_TYPE=\(.digest_type // "")\nDIGEST=\(.digest // "")\nDS=\(.ds // "")"' /tmp/after.json
          test "$ready" = true
