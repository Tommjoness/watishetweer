name: Cloudflare DNSSEC voorbereiden

on:
  push:
    branches: [ops/post-migration-audit-20260826]

permissions:
  contents: read

jobs:
  dnssec:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Toon volledige Cloudflare DNSSEC-gegevens
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=watishetweer.nl' -o /tmp/zones.json
          zone_id="$(jq -r '.result[0].id // ""' /tmp/zones.json)"
          test -n "$zone_id"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dnssec" -o /tmp/dnssec.json
          jq -e '.success == true' /tmp/dnssec.json >/dev/null
          jq -r '.result | "DNSSEC_STATUS=\(.status // "")\nKEY_TAG=\(.key_tag // "")\nALGORITHM=\(.algorithm // "")\nFLAGS=\(.flags // "")\nPUBLIC_KEY=\(.public_key // "")\nDIGEST_TYPE=\(.digest_type // "")\nDIGEST=\(.digest // "")\nDS=\(.ds // "")"' /tmp/dnssec.json

          test -n "$(jq -r '.result.key_tag // ""' /tmp/dnssec.json)"
          test -n "$(jq -r '.result.algorithm // ""' /tmp/dnssec.json)"
          test -n "$(jq -r '.result.flags // ""' /tmp/dnssec.json)"
          test -n "$(jq -r '.result.public_key // ""' /tmp/dnssec.json)"
