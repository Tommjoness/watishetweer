name: Test WeatherNow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Eén keer volledig testen en bouwen. Hier stond na `npm test` nog `npm run build`; die herbouw (ca. 10,5 minuten op de Ubuntu-runner:
      # prebuild-tests, artifact:base, test:built en de 73 stappen van het postbuild-script) herhaalde stappen die `npm test` zelf al uitvoert
      # (`npm test` begint met `npm run build`-onderdelen en voert dezelfde postbuild-stappen uit; gecontroleerd: alle 193 commando's van
      # `npm run build` staan, even vaak, in `npm test`). Kwaliteitsgates zijn daarmee niet verminderd: de build wordt nog in `npm test` gedaan en
      # onafhankelijk opnieuw in checkpoint-browsers (schone checkout), de preview-, cwv-, quality- en taalbewaker-jobs.
      - run: npm test
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js
