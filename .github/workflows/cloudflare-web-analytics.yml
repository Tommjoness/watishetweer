name: Cloudflare Web Analytics setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-web-analytics.yml'
      - 'scripts/cloudflare-web-analytics-setup.js'

permissions:
  contents: read

concurrency:
  group: watishetweer-cloudflare-web-analytics
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PROJECT: watishetweer
  SOURCE_SHA: ${{ github.sha }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exacte bron-SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Controleer credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Wacht tot dezelfde SHA publiek live staat
        shell: bash
        run: |
          set -euo pipefail
          live=false
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 30 https://watishetweer.nl/ || true)"
            if printf '%s' "$html" | grep -F "weather-build-sha" | grep -F "$SOURCE_SHA" >/dev/null; then
              live=true
              break
            fi
            echo "Productie-SHA nog niet gelijk aan $SOURCE_SHA; poging $attempt/60"
            sleep 10
          done
          if [ "$live" != true ]; then
            echo "Cloudflare Web Analytics wordt niet gewijzigd voordat de bedoelde SHA live staat."
            exit 1
          fi

      - name: Activeer Web Analytics idempotent
        run: node scripts/cloudflare-web-analytics-setup.js

      - name: Leg setupstatus vast
        run: |
          {
            echo '## Cloudflare Web Analytics'
            echo
            echo "- bron-SHA: $SOURCE_SHA"
            echo '- setupscript: geslaagd en na API-write opnieuw geverifieerd'
            echo '- automatische injectie: actief voor de watishetweer-zone'
            echo '- historische eigen disable_rum-regel: verwijderd indien aanwezig'
          } >> "$GITHUB_STEP_SUMMARY"
