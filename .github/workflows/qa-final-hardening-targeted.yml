name: Targeted final hardening QA
on:
  push:
    branches:
      - qa/final-hardening-targeted-20260902
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Installeer Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Zeven gevraagde locaties in Chromium en WebKit
        run: node .github/qa/final-hardening-targeted.js
