name: One-off mobile PageSpeed

on:
  push:
    branches:
      - measure/pagespeed-20260828

jobs:
  pagespeed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Meet PageSpeed mobiel drie keer
        shell: bash
        run: |
          python - <<'PY'
          import json, statistics, time, urllib.parse, urllib.request

          target = 'https://watishetweer.nl/'
          endpoint = 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed'
          results = []
          for run in range(1, 4):
              query = urllib.parse.urlencode({
                  'url': target,
                  'strategy': 'mobile',
                  'category': 'performance',
              })
              req = urllib.request.Request(endpoint + '?' + query, headers={'User-Agent': 'weathernow-pagespeed-check/1.0'})
              with urllib.request.urlopen(req, timeout=180) as response:
                  payload = json.load(response)
              lr = payload['lighthouseResult']
              audits = lr['audits']
              score = round(lr['categories']['performance']['score'] * 100)
              item = {
                  'run': run,
                  'score': score,
                  'cls': audits['cumulative-layout-shift']['numericValue'],
                  'lcp_ms': audits['largest-contentful-paint']['numericValue'],
                  'tbt_ms': audits['total-blocking-time']['numericValue'],
                  'fcp_ms': audits['first-contentful-paint']['numericValue'],
                  'speed_index_ms': audits['speed-index']['numericValue'],
              }
              results.append(item)
              print('PSI_RUN ' + json.dumps(item, separators=(',', ':')))
              if run < 3:
                  time.sleep(10)

          scores = [r['score'] for r in results]
          summary = {
              'target': target,
              'runs': results,
              'median_score': statistics.median(scores),
              'min_score': min(scores),
              'max_score': max(scores),
              'median_cls': statistics.median(r['cls'] for r in results),
              'median_lcp_ms': statistics.median(r['lcp_ms'] for r in results),
              'median_tbt_ms': statistics.median(r['tbt_ms'] for r in results),
          }
          print('PSI_SUMMARY ' + json.dumps(summary, separators=(',', ':')))
          PY
