name: Taalbewaker Engels

on:
  pull_request:
    branches: [main]

jobs:
  engels:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Bewaker tegen live Open-Meteo
        # Open-Meteo vraagt om geen live API-aanroepen vanuit CI (ticket #235915). Iedere Node-opdracht
        # hierna laadt scripts/ci/geen-live-openmeteo.cjs: Open-Meteo is onbereikbaar en elke poging wordt
        # vastgelegd; de laatste stap van deze job faalt als er één is.
        run: |
          echo "NODE_OPTIONS=--require $GITHUB_WORKSPACE/scripts/ci/geen-live-openmeteo.cjs" >> "$GITHUB_ENV"
          echo "GEEN_LIVE_OPENMETEO_LOG=$RUNNER_TEMP/geen-live-openmeteo.jsonl" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Installeer Playwright-pakket
        run: npm ci --ignore-scripts
      - name: Koppel Chromium
        run: |
          CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Bouw de definitieve site (inclusief taallader)
        run: npm run build
      - name: Iedere tekst in het Engels vertaald (vaste en willekeurige weersituaties)
        run: node scripts/taal-bewaker.js
      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: taal-bewaker-rapport
          path: taal-bewaker-rapport.json
          if-no-files-found: ignore
      - name: Controle geen live Open-Meteo
        if: always()
        run: NODE_OPTIONS= node scripts/ci/geen-live-openmeteo-controle.js
