name: Warning upstream probe

on:
  push:
    branches:
      - hardening/warning-latency-probe-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Meet compatfeed responseheaders
        shell: bash
        run: |
          set -euo pipefail
          ua='WatIsHetWeer/1.0 (watishetweer.nl; contact via github.com/Tommjoness/weathernow)'
          for slug in netherlands italy germany; do
            echo "--- $slug compat headers ---"
            rm -f /tmp/headers
            curl -sS --max-time 5 --max-filesize 1 -A "$ua" -H 'Accept: application/json' \
              -D /tmp/headers -o /dev/null \
              "https://feeds.meteoalarm.org/api/v1/warnings/feeds-${slug}" || true
            grep -Ei '^(HTTP/|content-length:|content-type:|transfer-encoding:|etag:|last-modified:|cache-control:)' /tmp/headers || true
          done
