name: Temporary desktop temperature artifact diagnostic

on:
  push:
    branches:
      - fix/desktop-24h-temperature-label-coverage-20260830

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/desktop-24h-temperature-label-coverage-20260830
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build production artifact
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --package-lock=false
          npm run artifact:base
          node scripts/postbuild-pipeline.js
          cp public/index.html _tmp-public-index.html
          git diff --check
      - name: Commit diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add _tmp-public-index.html
          if git diff --cached --quiet; then
            echo "Artifact unchanged."
            exit 0
          fi
          git commit -m 'Leg productieartifact tijdelijk vast voor grafiekdiagnose'
          git push origin HEAD:fix/desktop-24h-temperature-label-coverage-20260830
