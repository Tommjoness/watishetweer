name: WeatherNow correction validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/precipitation-copy-chart-density
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Confirm committed correction
        run: |
          grep -q "function neerslagKorteWeergave" interpretatie-engine.js
          grep -q "maximumLabels=M?" index.html
      - name: Run full tests
        run: npm test
      - name: Run production build
        run: npm run build
      - name: Remove temporary correction tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/weathernow-correction.yml \
            tools/apply-weather-copy-fix.js \
            tools/fix-weather-copy-test.js \
            tools/fix-chart-density-regressions.js \
            tools/fix-chart-overlap-test.js
          git commit -m "Remove temporary WeatherNow correction tooling"
          git push origin HEAD:fix/precipitation-copy-chart-density
