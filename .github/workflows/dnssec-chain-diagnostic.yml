name: DNSSEC chain diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-dnssec:
    if: github.head_ref == 'diag/dnssec-chain-20260826'
    runs-on: ubuntu-latest
    steps:
      - name: Google Public DNS validation
        shell: bash
        run: |
          set -euo pipefail
          for type in A DS DNSKEY; do
            curl -fsS "https://dns.google/resolve?name=watishetweer.nl&type=$type&do=1&cd=0" -o "/tmp/google-$type.json"
            echo "=== GOOGLE $type ==="
            jq '{Status, AD, CD, Answer}' "/tmp/google-$type.json"
          done
          test "$(jq -r '.Status' /tmp/google-A.json)" = "0"
          test "$(jq -r '.AD' /tmp/google-A.json)" = "true"
          jq -e '.Answer[]? | select(.type == 43 and (.data | startswith("2371 13 ")))' /tmp/google-DS.json >/dev/null
          jq -e '.Answer[]? | select(.type == 48 and (.data | startswith("257 3 13 ")))' /tmp/google-DNSKEY.json >/dev/null

      - name: Cloudflare Public DNS validation
        shell: bash
        run: |
          set -euo pipefail
          for type in A DS DNSKEY; do
            curl -fsS -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=watishetweer.nl&type=$type&do=true&cd=false" -o "/tmp/cf-$type.json"
            echo "=== CLOUDFLARE $type ==="
            jq '{Status, AD, CD, Answer}' "/tmp/cf-$type.json"
          done
          test "$(jq -r '.Status' /tmp/cf-A.json)" = "0"
          test "$(jq -r '.AD' /tmp/cf-A.json)" = "true"
          jq -e '.Answer[]? | select(.type == 43 and (.data | startswith("2371 13 ")))' /tmp/cf-DS.json >/dev/null
          jq -e '.Answer[]? | select(.type == 48 and (.data | startswith("257 3 13 ")))' /tmp/cf-DNSKEY.json >/dev/null

      - name: Report validated chain
        run: echo 'DNSSEC chain validated by both Google Public DNS and Cloudflare Public DNS; DS key tag 2371 / algorithm 13 and KSK algorithm 13 are publicly present.'
