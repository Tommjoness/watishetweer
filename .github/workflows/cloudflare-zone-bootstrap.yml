name: Cloudflare zone bootstrap

on:
  push:
    branches: [ops/cloudflare-domain-diagnose-20260826]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bereid zone en DNS veilig voor
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          ZONE='watishetweer.nl'
          PAGES='watishetweer.pages.dev'

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE" -o /tmp/zones.json
          zone_id="$(jq -r '.result[0].id // ""' /tmp/zones.json)"
          test -n "$zone_id"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id" -o /tmp/zone.json
          jq -e '.success == true' /tmp/zone.json >/dev/null
          echo "Zone-status: $(jq -r '.result.status' /tmp/zone.json)"
          echo "Cloudflare nameservers: $(jq -r '.result.name_servers | join(", ")' /tmp/zone.json)"

          upsert() {
            local type="$1" name="$2" content="$3" priority="${4:-}" proxied="${5:-}"
            local encoded_name
            encoded_name="$(printf '%s' "$name" | jq -sRr @uri)"
            curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=$type&name=$encoded_name&per_page=100" -o /tmp/lookup.json
            jq -e '.success == true' /tmp/lookup.json >/dev/null
            local id
            id="$(jq -r '.result[0].id // ""' /tmp/lookup.json)"

            local body
            case "$type" in
              MX)
                body="$(jq -cn --arg type "$type" --arg name "$name" --arg content "$content" --argjson priority "$priority" '{type:$type,name:$name,content:$content,ttl:1,priority:$priority}')"
                ;;
              A|AAAA|CNAME)
                body="$(jq -cn --arg type "$type" --arg name "$name" --arg content "$content" --argjson proxied "$proxied" '{type:$type,name:$name,content:$content,ttl:1,proxied:$proxied}')"
                ;;
              *)
                body="$(jq -cn --arg type "$type" --arg name "$name" --arg content "$content" '{type:$type,name:$name,content:$content,ttl:1}')"
                ;;
            esac

            if [ -n "$id" ]; then
              curl -fsS "${auth[@]}" -X PUT "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$id" --data "$body" -o /tmp/write.json
            else
              curl -fsS "${auth[@]}" -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" --data "$body" -o /tmp/write.json
            fi
            jq -e '.success == true' /tmp/write.json >/dev/null
            echo "DNS gereed: $type $name"
          }

          # Mail en verificatie: exact behouden zoals publiek bij TransIP gevonden.
          upsert CNAME 'autoconfig.watishetweer.nl' 'autoconfig.transip.email' '' false
          upsert CNAME 'autodiscover.watishetweer.nl' 'autodiscover.transip.email' '' false
          upsert TXT '_dmarc.watishetweer.nl' 'v=DMARC1; p=none;'
          upsert A '*.watishetweer.nl' '86.105.244.1' '' false
          upsert AAAA '*.watishetweer.nl' '2a01:7c8:e100:1::50a0' '' false
          upsert MX 'watishetweer.nl' 'mx.transip.email' 10
          upsert TXT 'watishetweer.nl' 'google-site-verification=HhNZvxTogJOtg-j9epcy3hWPlaS0GbFoksdOSzLNimc'
          upsert TXT 'watishetweer.nl' 'v=spf1 include:_spf.transip.email ~all'

          # Oude web-IP/CNAME-records mogen niet naast de Pages CNAME blijven bestaan.
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100" -o /tmp/current.json
          jq -e '.success == true' /tmp/current.json >/dev/null
          jq -r --arg pages "$PAGES" '.result[] | select((.name == "watishetweer.nl" or .name == "www.watishetweer.nl") and (.type == "A" or .type == "AAAA" or (.type == "CNAME" and .content != $pages))) | .id' /tmp/current.json | while read -r id; do
            test -n "$id" || continue
            curl -fsS "${auth[@]}" -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$id" -o /tmp/delete.json
            jq -e '.success == true' /tmp/delete.json >/dev/null
          done

          # Beide hostnames zijn al als Pages custom domain geregistreerd.
          upsert CNAME 'watishetweer.nl' "$PAGES" '' true
          upsert CNAME 'www.watishetweer.nl' "$PAGES" '' true

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100" -o /tmp/final.json
          jq -e '.success == true' /tmp/final.json >/dev/null

          # Fail closed: deze records moeten allemaal bestaan vóór de nameservercutover.
          jq -e '.result[] | select(.type=="MX" and .name=="watishetweer.nl" and .content=="mx.transip.email" and .priority==10)' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="TXT" and .name=="watishetweer.nl" and .content=="v=spf1 include:_spf.transip.email ~all")' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="TXT" and .name=="_dmarc.watishetweer.nl" and .content=="v=DMARC1; p=none;")' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="CNAME" and .name=="autoconfig.watishetweer.nl" and .content=="autoconfig.transip.email" and .proxied==false)' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="CNAME" and .name=="autodiscover.watishetweer.nl" and .content=="autodiscover.transip.email" and .proxied==false)' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="TXT" and .name=="watishetweer.nl" and (.content|startswith("google-site-verification=")))' /tmp/final.json >/dev/null
          jq -e --arg pages "$PAGES" '.result[] | select(.type=="CNAME" and .name=="watishetweer.nl" and .content==$pages and .proxied==true)' /tmp/final.json >/dev/null
          jq -e --arg pages "$PAGES" '.result[] | select(.type=="CNAME" and .name=="www.watishetweer.nl" and .content==$pages and .proxied==true)' /tmp/final.json >/dev/null

          echo 'DNS PRE-CUTOVER GEREED'
          jq -r '.result[] | [.type,.name,.content,(.priority//""),(.proxied//false)] | @tsv' /tmp/final.json | sort
