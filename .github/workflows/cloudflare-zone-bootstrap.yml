name: Cloudflare zone bootstrap

on:
  push:
    branches: [ops/cloudflare-domain-diagnose-20260826]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bereid zone en DNS veilig voor
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          ZONE='watishetweer.nl'
          PAGES='watishetweer.pages.dev'

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE" -o /tmp/zones.json
          zone_id="$(jq -r '.result[0].id // ""' /tmp/zones.json)"
          test -n "$zone_id"
          echo "ZONE_ID=$zone_id"

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id" -o /tmp/zone.json
          jq -e '.success == true' /tmp/zone.json >/dev/null
          echo "Zone-status: $(jq -r '.result.status' /tmp/zone.json)"
          echo "Cloudflare nameservers: $(jq -r '.result.name_servers | join(", ")' /tmp/zone.json)"

          # Haal de gescande records op. De oude webrecords worden bewust niet overgenomen;
          # alle mail-, verificatie- en overige records wel.
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/scan/review" -o /tmp/review.json
          jq -e '.success == true' /tmp/review.json >/dev/null

          jq '{
            accepts: [.result[] | select(.name != "watishetweer.nl" or .type != "A") | select(.name != "www.watishetweer.nl" or .type != "CNAME") |
              if .type == "MX" then {type,name,content,ttl,priority}
              elif (.type == "A" or .type == "AAAA" or .type == "CNAME") then {type,name,content,ttl,proxied}
              else {type,name,content,ttl}
              end],
            rejects: [.result[] | select((.name == "watishetweer.nl" and .type == "A") or (.name == "www.watishetweer.nl" and .type == "CNAME")) |
              if .type == "CNAME" then {type,name,content,ttl,proxied}
              else {type,name,content,ttl,proxied}
              end]
          }' /tmp/review.json > /tmp/decision.json

          if [ "$(jq '.accepts | length' /tmp/decision.json)" -gt 0 ] || [ "$(jq '.rejects | length' /tmp/decision.json)" -gt 0 ]; then
            curl -fsS "${auth[@]}" -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/scan/review" \
              --data-binary @/tmp/decision.json -o /tmp/accepted.json
            jq -e '.success == true' /tmp/accepted.json >/dev/null
            echo "Scanned DNS verwerkt: $(jq '.result.accepts | length' /tmp/accepted.json) geaccepteerd, $(jq '.result.rejects | length' /tmp/accepted.json) verworpen."
          else
            echo 'Geen tijdelijke scanrecords meer te verwerken.'
          fi

          # Verwijder uitsluitend eventuele oude A/AAAA/CNAME-webrecords op apex en www.
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100" -o /tmp/current.json
          jq -e '.success == true' /tmp/current.json >/dev/null
          jq -r '.result[] | select((.name == "watishetweer.nl" or .name == "www.watishetweer.nl") and (.type == "A" or .type == "AAAA" or .type == "CNAME")) | .id' /tmp/current.json | while read -r id; do
            test -n "$id" || continue
            curl -fsS "${auth[@]}" -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$id" -o /tmp/delete.json
            jq -e '.success == true' /tmp/delete.json >/dev/null
          done

          # Beide webhostnames zijn al als Pages custom domain geregistreerd; wijs ze nu naar Pages.
          for host in 'watishetweer.nl' 'www.watishetweer.nl'; do
            body="$(jq -cn --arg name "$host" --arg content "$PAGES" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')"
            curl -fsS "${auth[@]}" -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
              --data "$body" -o /tmp/create-record.json
            jq -e '.success == true' /tmp/create-record.json >/dev/null
          done

          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?per_page=100" -o /tmp/final.json
          jq -e '.success == true' /tmp/final.json >/dev/null

          # Fail closed: mail en verificatie moeten aanwezig zijn vóór een nameserverwijziging.
          jq -e '.result[] | select(.type=="MX" and .name=="watishetweer.nl" and .content=="mx.transip.email" and .priority==10)' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="TXT" and .name=="watishetweer.nl" and (.content|contains("v=spf1 include:_spf.transip.email ~all")))' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="TXT" and .name=="_dmarc.watishetweer.nl" and (.content|contains("v=DMARC1; p=none;")))' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="CNAME" and .name=="autoconfig.watishetweer.nl" and .content=="autoconfig.transip.email")' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="CNAME" and .name=="autodiscover.watishetweer.nl" and .content=="autodiscover.transip.email")' /tmp/final.json >/dev/null
          jq -e '.result[] | select(.type=="TXT" and .name=="watishetweer.nl" and (.content|contains("google-site-verification=")))' /tmp/final.json >/dev/null
          jq -e --arg pages "$PAGES" '.result[] | select(.type=="CNAME" and .name=="watishetweer.nl" and .content==$pages and .proxied==true)' /tmp/final.json >/dev/null
          jq -e --arg pages "$PAGES" '.result[] | select(.type=="CNAME" and .name=="www.watishetweer.nl" and .content==$pages and .proxied==true)' /tmp/final.json >/dev/null

          echo 'DNS PRE-CUTOVER GEREED'
          jq -r '.result[] | [.type,.name,.content,(.priority//""),(.proxied//false)] | @tsv' /tmp/final.json | sort
