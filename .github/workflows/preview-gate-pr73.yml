name: WeatherNow mobile Nachtzicht preview gate PR73

on:
  pull_request:
    branches: [agent/mobile-nachtzicht-readability-20260814]

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Toon Chrome-versie
        run: google-chrome --version
      - name: Installeer alleen Playwright-package
        run: npm install --no-save --package-lock=false playwright
      - name: Controleer echte PR73-preview op 1440, 390, 360 en 320 px
        env:
          PREVIEW_URL: "https://weathernow-63ka7w0qw-tommjoness-projects.vercel.app/?_vercel_share=BNCDXVymZL8eKAtYl4UzoIU8TCWBKjG3&lat=52.3500&lon=5.2600&plaats=Almere&land=NL"
        run: |
          cat > .preview-gate-pr73.js <<'NODE'
          "use strict";
          const assert=require("assert");
          const {chromium}=require("playwright");
          const url=process.env.PREVIEW_URL;
          if(!url)throw new Error("PREVIEW_URL ontbreekt");

          const doelen=[
            ["desktop",{width:1440,height:900}],
            ["mobile-390",{width:390,height:844}],
            ["mobile-360",{width:360,height:800}],
            ["mobile-320",{width:320,height:700}]
          ];

          async function controle(browser,naam,viewport){
            const context=await browser.newContext({viewport,serviceWorkers:"block"});
            const page=await context.newPage();
            const fouten=[];
            page.on("pageerror",e=>fouten.push("pageerror: "+String(e)));
            page.on("console",m=>{if(m.type()==="error")fouten.push("console: "+m.text());});
            try{
              const response=await page.goto(url,{waitUntil:"domcontentloaded",timeout:45000});
              assert(response,naam+": geen navigatieresponse");
              assert(response.status()<400,naam+": HTTP "+response.status());
              await page.waitForSelector("#app",{state:"visible",timeout:30000});
              await page.waitForSelector("#nights .row.night:not(.kop)",{state:"visible",timeout:30000});
              await page.waitForFunction(()=>{
                const t=document.querySelector("#t"),c=document.querySelector("#cond");
                return t&&c&&t.textContent.trim()&&!/[–—]/.test(t.textContent)&&c.textContent.trim();
              },null,{timeout:30000});
              await page.waitForTimeout(1200);

              const r=await page.evaluate(()=>{
                const css=s=>{const el=document.querySelector(s);return el?getComputedStyle(el):null;};
                const advies=css("#nights .row.night:not(.kop) .nachtadvies");
                const maan=css("#nights .row.night:not(.kop) .nachtmaan");
                const kop=css("#nights .row.night.kop > .nmeta:not(.wide)");
                const rows=[...document.querySelectorAll("#nights .row.night")];
                const wides=[...document.querySelectorAll("#nights .row.night:not(.kop) .nmeta.wide")];
                return {
                  href:location.href,
                  width:innerWidth,
                  documentWidth:document.documentElement.scrollWidth,
                  nights:document.querySelectorAll("#nights .row.night:not(.kop)").length,
                  adviceFont:advies?.fontSize||null,
                  adviceLine:advies?.lineHeight||null,
                  moonFont:maan?.fontSize||null,
                  moonLine:maan?.lineHeight||null,
                  headerFont:kop?.fontSize||null,
                  rowOverflow:rows.some(el=>el.scrollWidth>el.clientWidth+1),
                  wideOverflow:wides.some(el=>el.scrollWidth>el.clientWidth+1),
                  rowOutside:rows.some(el=>{const b=el.getBoundingClientRect();return b.left<-1||b.right>innerWidth+1;}),
                  stateVisible:document.querySelector("#state")?getComputedStyle(document.querySelector("#state")).display!=="none":false
                };
              });

              assert(r.href.includes("weathernow-63ka7w0qw-tommjoness-projects.vercel.app"),naam+": onverwachte eind-URL "+r.href);
              assert(r.nights>=5,naam+": Nachtzicht onvolledig: "+r.nights);
              assert(r.documentWidth<=r.width+2,naam+`: horizontale pagina-overflow ${r.documentWidth} > ${r.width}`);
              assert.equal(r.rowOverflow,false,naam+": Nachtzicht-rij heeft interne overflow");
              assert.equal(r.wideOverflow,false,naam+": toelichting wordt horizontaal afgeknipt");
              assert.equal(r.rowOutside,false,naam+": Nachtzicht-rij valt buiten viewport");
              assert.equal(r.stateVisible,false,naam+": loading/foutstate bleef zichtbaar");
              if(viewport.width<=900){
                assert.equal(r.adviceFont,"13px",naam+": adviesfont "+r.adviceFont);
                assert.equal(r.moonFont,"12px",naam+": maanfont "+r.moonFont);
                assert.equal(r.headerFont,viewport.width<=360?"9.5px":"10px",naam+": kopfont "+r.headerFont);
              }
              assert.deepEqual(fouten,[],naam+": browserfouten: "+fouten.join(" | "));

              await page.locator("#nights").screenshot({path:`nachtzicht-${naam}.png`});
              if(naam==="mobile-390")await page.screenshot({path:"preview-mobile-390-full.png",fullPage:true});
              console.log(naam+" groen: "+JSON.stringify(r));
            }finally{await context.close();}
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,channel:"chrome"});
            try{
              for(const [naam,viewport] of doelen)await controle(browser,naam,viewport);
              console.log("PR73 responsive Nachtzicht-previewgate volledig groen.");
            }finally{await browser.close();}
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE
          node .preview-gate-pr73.js
      - name: Bewaar screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr73-responsive-nachtzicht-screenshots
          path: |
            nachtzicht-*.png
            preview-mobile-390-full.png
          if-no-files-found: warn
          retention-days: 1
