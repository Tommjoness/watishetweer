name: Live KNMI post-cache probe

on:
  push:
    branches:
      - hardening/live-knmi-postcache-probe-20260830

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bewijs koude KNMI-route en 25-punts nowcast
        shell: bash
        run: |
          set -euo pipefail
          url='https://6027a764.watishetweer.pages.dev/api/neerslag?lat=51.989&lon=5.0939&land=NL'
          headers=/tmp/knmi.headers
          body=/tmp/knmi.json
          metrics="$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' \
            -D "$headers" -o "$body" \
            -w '%{http_code} %{time_total}' "$url")"
          status="${metrics%% *}"
          total="${metrics#* }"
          edge="$(awk 'BEGIN{IGNORECASE=1} /^x-wiw-edge-cache:/{gsub("\r",""); print $2}' "$headers" | tail -1)"
          echo "status=$status total=${total}s edge=${edge:-missing}"
          jq '{beschikbaar,bron,actueel:(if .actueel then {tijd:.actueel.tijd,waarde:.actueel.waarde} else null end),nowcast:(if .nowcast then {referenceTime:.nowcast.referenceTime,horizonMinuten:.nowcast.horizonMinuten,punten:(.nowcast.punten|length),eerste:.nowcast.punten[0],laatste:.nowcast.punten[-1]} else null end)}' "$body"
          test "$status" = 200
          test "$edge" = BYPASS
          python3 - <<'PY'
          import json
          from datetime import datetime
          with open('/tmp/knmi.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('beschikbaar') is True, data
          assert data.get('bron') == 'KNMI', data
          now = data.get('nowcast')
          assert isinstance(now, dict), data
          points = now.get('punten')
          assert isinstance(points, list) and len(points) == 25, len(points) if isinstance(points, list) else points
          assert now.get('horizonMinuten') == 120, now.get('horizonMinuten')
          def parse(s):
              return datetime.fromisoformat(s.replace('Z', '+00:00'))
          times = [parse(p['tijd']) for p in points]
          for i, p in enumerate(points):
              v = p.get('waarde')
              assert isinstance(v, (int, float)) and not isinstance(v, bool) and v >= 0, (i, v)
              if i:
                  assert (times[i] - times[i-1]).total_seconds() == 300, (i, points[i-1]['tijd'], p['tijd'])
          assert (times[-1] - times[0]).total_seconds() == 7200, (points[0]['tijd'], points[-1]['tijd'])
          assert parse(now['referenceTime']) == times[0], (now['referenceTime'], points[0]['tijd'])
          print('KNMI live truth: exact 25 aaneengesloten 5-minutenpunten, 120 minuten horizon, alle waarden numeriek en niet-negatief.')
          PY
