name: CWV desktop recovery

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-final-artifact:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Test uurselectie, DST en gereserveerde routeshell
        run: node scripts/cwv-hour-selection.test.js
      - name: Bouw finale CWV-recoveryartifact
        env:
          WEATHER_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build:cloudflare
      - name: Meet routes, shifts, desktopgeometrie en interacties
        run: node scripts/cwv-desktop-recovery-browser.js
      - name: Webfontwissel zonder layoutverschuiving bij trage fonts
        run: node scripts/font-swap-cls-browser.test.js
      - name: Eerste scherm mobiel en desktop
        run: node scripts/first-screen-browser.test.js
      - name: Bediening, tapdoelen en Auto-thema
        run: node scripts/bediening-browser.test.js
      - name: Leesbaarheid, minimale lettergroottes
        run: node scripts/leesbaarheid-browser.test.js
      - name: Uurtijden, neerslag per uur vanaf het tijdstip
        run: node scripts/uurtijden-browser.test.js
      - name: Onderkant, gebruikte bronnen en SEO-blok in de paginakolom
        run: node scripts/onderkant-browser.test.js
      - name: Kop, knoppen onder de zoekbalk en inhoud hoger
        run: node scripts/kop-browser.test.js
      - name: Nachtzicht, twee regels per nacht op mobiel
        run: node scripts/nachtzicht-browser.test.js
      - name: Bewaar reproduceerbare CWV-metingen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cwv-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: cwv-evidence/
          retention-days: 14
