<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Pagina niet gevonden | Wat is het weer?</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f5f3ee;color:#171717}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f3ee;color:#171717}
    main{width:min(560px,100%);border-top:1px solid #171717;padding-top:28px}
    .code{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
    h1{font-size:clamp(2rem,7vw,4rem);line-height:1;margin:12px 0 18px;font-weight:600}
    p{font-size:1rem;line-height:1.6;max-width:44ch;margin:0 0 24px}
    a{display:inline-block;color:inherit;text-underline-offset:4px;font-weight:600}
    @media(prefers-color-scheme:dark){:root,body{background:#111;color:#f5f3ee}main{border-color:#f5f3ee}}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Pagina niet gevonden</h1>
    <p>Deze pagina bestaat niet of is verplaatst. Ga terug naar de weersverwachting en zoek daar je plaats.</p>
    <a href="/">Naar Wat is het weer?</a>
  </main>
</body>
</html>
